<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Exam Hub - CBT Practice Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');

        :root {
            --navy: #001f3f;
            --navy-dark: #001226;
            --green: #38761d;
            --green-bright: #4bb543;
            --bg-light: #f8fafc;
            --card-shadow: 0 10px 30px -5px rgba(0, 31, 63, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 31, 63, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--navy);
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--green);
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: #ffffff;
        }

        .hero-banner {
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
            color: #ffffff;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 5px solid var(--green);
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: #cbd5e1;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .search-wrapper {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 25px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            outline: none;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .category-section {
            margin-bottom: 45px;
        }

        .category-header {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--navy);
            border-left: 5px solid var(--green);
            padding-left: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 22px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 31, 63, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px -5px rgba(0, 31, 63, 0.15);
        }

        .course-code {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 6px;
        }

        .course-title {
            font-size: 0.88rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 18px;
            line-height: 1.4;
            min-height: 38px;
        }

        .start-btn {
            background: var(--green);
            color: #ffffff;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            transition: background 0.2s ease;
            display: block;
        }

        .start-btn:hover {
            background: #2d5e17;
        }

        footer {
            background: #ffffff;
            padding: 20px 40px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            margin-top: auto;
        }

        .footer-copy {
            font-size: 0.85rem;
            color: #64748b;
        }

        @media (max-width: 600px) {
            header { padding: 15px 20px; }
            .hero-title { font-size: 1.7rem; }
            .course-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        // Helper function to turn course code into standard HTML filename (e.g. "GST 101" -> "test_GST101.html")
        function formatCourseFileName(code) {
            const cleanCode = code.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            return `test_${cleanCode}.html`;
        }

        // Render Courses into the Container
        function renderCourses(data) {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';

            data.forEach(sec => {
                if (sec.courses.length === 0) return;

                const sectionEl = document.createElement('div');
                sectionEl.className = 'category-section';

                const headerEl = document.createElement('div');
                headerEl.className = 'category-header';
                headerEl.innerText = sec.category;
                sectionEl.appendChild(headerEl);

                const gridEl = document.createElement('div');
                gridEl.className = 'course-grid';

                sec.courses.forEach(c => {
                    const fileName = formatCourseFileName(c.code);
                    const cardEl = document.createElement('div');
                    cardEl.className = 'course-card';
                    cardEl.innerHTML = `
                        <div>
                            <div class="course-code">${c.code}</div>
                            <div class="course-title">${c.name}</div>
                        </div>
                        <a href="${fileName}" class="start-btn">Start Test →</a>
                    `;
                    gridEl.appendChild(cardEl);
                });

                sectionEl.appendChild(gridEl);
                container.appendChild(sectionEl);
            });
        }

        // Filter Logic for Real-time Search
        function filterCourses() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filteredData = courseData.map(sec => {
                const matchedCourses = sec.courses.filter(c => 
                    c.code.toLowerCase().includes(query) || 
                    c.name.toLowerCase().includes(query)
                );
                return {
                    category: sec.category,
                    courses: matchedCourses
                };
            });

            renderCourses(filteredData);
        }

        // Initial Load
        renderCourses(courseData);
