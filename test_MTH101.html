<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Exam Hub - MTH 101 Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        :root { 
            --navy: #001f3f; 
            --green: #38761d; 
            --green-light: #eef7ed;
            --red-light: #fef2f2;
            --light-bg: #f8fafc; 
            --gradient: linear-gradient(135deg, #001f3f 0%, #38761d 100%); 
            --card-shadow: 0 10px 25px -5px rgba(0, 31, 63, 0.05), 0 8px 10px -6px rgba(0, 31, 63, 0.05);
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--light-bg); margin: 0; padding: 20px; color: var(--navy); display: flex; flex-direction: column; min-height: 100vh; }
        
        #sync-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--green); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 900px; margin: auto; flex: 1; width: 100%; box-sizing: border-box; }
        header { text-align: center; padding: 40px 20px; background: var(--gradient); color: white; border-radius: 24px; margin-bottom: 35px; box-shadow: 0 10px 30px rgba(0,31,63,0.15); }
        header h1 { margin: 0; font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; }
        header p { margin: 10px 0 0 0; opacity: 0.9; font-weight: 300; }
        
        .exam-layout { display: grid; grid-template-columns: 1fr 280px; gap: 25px; max-width: 1150px; margin: auto; align-items: start; width: 100%; box-sizing: border-box; }
        .sidebar-wrapper { position: -webkit-sticky; position: sticky; top: 20px; z-index: 999; }

        @media (max-width: 900px) { 
            .exam-layout { grid-template-columns: 1fr; } 
            .sidebar-wrapper { position: -webkit-sticky; position: sticky; top: 10px; width: 100%; } 
        }

        #exam-main { background: white; padding: 30px; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid rgba(0,31,63,0.05); }
        .timer-bar { position: -webkit-sticky; position: sticky; top: 20px; background: var(--green); color: white; padding: 14px; border-radius: 50px; text-align: center; font-weight: bold; z-index: 100; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(56,118,29,0.3); font-size: 1.1rem; }
        
        .question-block { display: none; margin-bottom: 35px; padding-bottom: 25px; text-align: left; }
        .question-block.active { display: block; }
        
        .question-block p { font-size: 1.05rem; line-height: 1.6; margin-top: 0; }
        .options-group label { display: flex; align-items: center; background: #f8fafc; padding: 16px; margin: 12px 0; border-radius: 14px; cursor: pointer; border: 1px solid #e2e8f0; transition: all 0.2s ease; font-weight: 400; }
        .options-group label:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .options-group input[type="radio"] { margin-right: 12px; width: 18px; height: 18px; accent-color: var(--green); }
        
        .nav-controls { display: flex; gap: 15px; margin-top: 25px; margin-bottom: 15px; }
        .btn-nav { flex: 1; padding: 15px; background: #475569; color: white; border: none; border-radius: 14px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .btn-nav:hover { background: #334155; }
        .btn-nav:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        
        .btn-action { width: 100%; padding: 18px; background: var(--navy); color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 1.05rem; cursor: pointer; margin-top: 20px; transition: background 0.2s, transform 0.1s; }
        .btn-action:hover { background: #002d5c; }
        .btn-action:active { transform: scale(0.99); }
        
        .tracker-sidebar { background: white; padding: 24px; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid rgba(0,31,63,0.1); max-height: calc(100vh - 80px); display: flex; flex-direction: column; }
        .tracker-title { font-weight: 800; font-size: 1rem; margin-bottom: 15px; text-align: center; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; letter-spacing: 0.5px; }
        .tracker-container { overflow-y: auto; padding-right: 4px; }
        .tracker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .tracker-dot { height: 40px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: #64748b; cursor: pointer; transition: all 0.2s ease; }
        .tracker-dot:hover { border-color: var(--navy); color: var(--navy); background: #e2e8f0; }
        .tracker-dot.current { border-color: var(--navy); color: var(--navy); background: #e2e8f0; box-shadow: 0 0 0 2px var(--navy); }
        .tracker-dot.answered { background: var(--green); color: white; border-color: var(--green); box-shadow: 0 4px 10px rgba(56,118,29,0.2); }
        .tracker-dot.answered.current { box-shadow: 0 0 0 2px var(--navy); }

        /* REVIEW STYLES */
        .review-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: left; box-shadow: var(--card-shadow); border: 1px solid #e2e8f0; }
        .explanation-box { margin-top: 12px; padding: 14px; border-radius: 10px; font-size: 0.92rem; line-height: 1.5; }
        .explanation-box.correct-bg { background: var(--green-light); border-left: 4px solid var(--green); color: #1e4620; }
        .explanation-box.wrong-bg { background: var(--red-light); border-left: 4px solid #d32f2f; color: #991b1b; }

        #result-screen { display: none; text-align: center; padding: 50px 20px; }
        
        footer { margin-top: auto; padding: 40px 20px 20px 20px; text-align: center; border-top: 1px solid #e2e8f0; width: 100%; box-sizing: border-box; }
        .footer-copy { font-size: 0.9rem; color: #64748b; margin-bottom: 15px; }
        .dev-btn { background: transparent; border: 1px solid var(--navy); color: var(--navy); padding: 8px 20px; border-radius: 50px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; font-family: 'Poppins', sans-serif; text-decoration: none; display: inline-block; }
        .dev-btn:hover { background: var(--navy); color: white; }
    </style>
</head>
<body onload="initExam()">

<div id="sync-loader">
    <div class="spinner"></div>
    <p style="font-weight: 600; color: var(--navy);">Loading MTH 101 Questions & Step-by-Step Solutions...</p>
</div>

<div class="container">
    <header>
        <h1>ELEMENTARY MATHEMATICS (MTH 101)</h1>
        <p>Elite Exam Hub • Fully Solved Step-by-Step Solutions ⚡</p>

</div>

<div class="exam-layout" id="exam-container">

        <div class="timer-bar" id="timer">Time Remaining: 20:00</div>
        <div id="question-list"></div>
        
        <div class="nav-controls">

        <button class="btn-action" onclick="submitExam()">Submit Exam</button>

    <div class="sidebar-wrapper">
        <div class="tracker-sidebar">
            <div class="tracker-title">Question Status</div>
            <div class="tracker-container">
                <div class="tracker-grid" id="status-panel-grid"></div>
            </div>
        </div>
    </div>
</div>

<div class="container" id="result-screen"></div>

<footer>
    <div class="footer-copy">&copy; 2026 Elite Exam Hub. All Rights Reserved.</div>
    <a href="https://wa.me/2349032320783" target="_blank" class="dev-btn">Message the Developer</a>
</footer>

<script>
// Pool of 200 distinctive MTH101 questions complete with detailed explanations
const fullMthPool = [
    { q: "A set is a ____ collection of objects.", o: ["random", "ordered-only", "well-defined", "finite-only"], a: 2, exp: "By mathematical definition, a set is a well-defined collection of distinct objects, meaning there is a clear rule to determine whether any given object belongs to the set." },
    { q: "An object belonging to set A is written as ____.", o: ["x ∈ A", "A ∈ x", "x ⊂ A", "x ∉ A"], a: 0, exp: "The symbol '∈' denotes set membership. Thus, 'x ∈ A' reads 'x is an element of set A'." },
    { q: "A set with no elements is called a ____.", o: ["singleton", "universal set", "empty set", "infinite set"], a: 2, exp: "An empty set (or null set, denoted by ∅ or {}) contains absolutely no elements." },
    { q: "A set with exactly one element is called a ____.", o: ["power set", "universal set", "singleton", "null set"], a: 2, exp: "A set containing precisely one element is termed a singleton set (e.g., {5})." },
    { q: "The number of elements in a finite set is its ____.", o: ["cardinality", "complement", "intersection", "union"], a: 0, exp: "Cardinality measures the size or count of elements contained within a finite set, denoted as n(A) or |A|." },
    { q: "Which notation lists the members explicitly?", o: ["Matrix notation", "Recursive notation", "Predicate notation", "List notation"], a: 3, exp: "List notation (or roster notation) enumerates all the individual elements of a set explicitly inside braces, e.g., {1, 2, 3}." },
    { q: "A = {1,2,…,5000} is an example of ____ notation.", o: ["matrix", "abridged list", "recursive", "predicate"], a: 1, exp: "An abridged list notation uses ellipsis (...) to skip predictable intermediate elements when the pattern is obvious." },
    { q: "Predicate notation specifies a set using a common ____.", o: ["factor", "property", "matrix", "determinant"], a: 1, exp: "Predicate (or set-builder) notation defines a set by stating a common property shared by its members, e.g., {x | x > 0}." },
    { q: "The power set P(A) contains ____.", o: ["only proper subsets of A", "all supersets of A", "all subsets of A", "only elements of A"], a: 2, exp: "The power set P(A) is the collection of every possible subset of A, including the empty set and A itself." },
    { q: "If A has n elements, P(A) has ____ elements.", o: ["2n", "n²", "2ⁿ", "n"], a: 2, exp: "For any set with n elements, its power set contains exactly 2ⁿ subsets because each element has 2 choices (either included or excluded)." },
    { q: "A ∪ B contains elements in ____.", o: ["A or B or both", "neither A nor B", "A and B only", "A but not B"], a: 0, exp: "The union A ∪ B combines all elements belonging to set A, set B, or both sets simultaneously." },
    { q: "A ∩ B contains elements in ____.", o: ["neither", "B only", "both A and B", "A only"], a: 2, exp: "The intersection A ∩ B consists strictly of elements common to both set A and set B." },
    { q: "A − B contains elements that are ____.", o: ["in both", "in A but not B", "outside A", "in B but not A"], a: 1, exp: "The relative complement A − B (difference) includes elements residing in A that are stripped of any elements shared with B." },
    { q: "A △ B contains elements that are ____.", o: ["in neither set", "in A only", "in exactly one of A and B", "in both sets"], a: 2, exp: "The symmetric difference A △ B = (A ∪ B) − (A ∩ B) contains elements that belong to either A or B, but not to their intersection." },
    { q: "If A ⊂ B, every element of A is also in ____.", o: ["A′", "B", "B′", "U only"], a: 1, exp: "By definition of subset (A ⊂ B), every single element contained within set A is also located inside set B." },
    { q: "The complement A′ consists of elements ____.", o: ["outside U", "in U but not A", "in A only", "in A ∩ B"], a: 1, exp: "The complement A′ contains all elements present in the universal set U that do not belong to set A." },
    { q: "Which law gives X ∪ X = X?", o: ["Distributive law", "De Morgan law", "Idempotent law", "Commutative law"], a: 2, exp: "The idempotent law states that operating on a set with itself yields the same set (e.g., X ∪ X = X and X ∩ X = X)." },
    { q: "Which law gives X ∪ Y = Y ∪ X?", o: ["Complement law", "Identity law", "Associative law", "Commutative law"], a: 3, exp: "The commutative law allows changing the order of sets in union and intersection without altering the result." },
    { q: "Which is a De Morgan law?", o: ["(X ∪ Y)′ = X′ ∩ Y′", "X ∩ U = X", "X ∪ X = X", "X − X = U"], a: 0, exp: "De Morgan's laws state that the complement of a union is the intersection of complements: (X ∪ Y)′ = X′ ∩ Y′." },
    { q: "If n(U) = 50 and n(A) = 18, n(A′) = ____.", o: ["50", "18", "68", "32"], a: 3, exp: "n(A′) = n(U) − n(A) = 50 − 18 = 32." },
    { q: "If A = {1,3,5} and B = {3,5,7}, A ∩ B = ____.", o: ["{1,7}", "∅", "{3,5}", "{1,3,5,7}"], a: 2, exp: "The common elements present in both sets are 3 and 5, so A ∩ B = {3, 5}." },
    { q: "If A = {1,2,3} and B = {3,4,5}, A ∪ B = ____.", o: ["{4,5}", "{1,2}", "{1,2,3,4,5}", "{3}"], a: 2, exp: "Combining all unique elements from both sets yields {1, 2, 3, 4, 5}." },
    { q: "If A = {1,2,3,4} and B = {2,4,6}, A − B = ____.", o: ["{1,2,3,4,6}", "{1,3}", "{2,4}", "{6}"], a: 1, exp: "Removing elements of B ({2, 4}) from A leaves {1, 3}." },
    { q: "If A has 4 elements, |P(A)| = ____.", o: ["16", "4", "12", "8"], a: 0, exp: "|P(A)| = 2⁴ = 16 subsets." },
    { q: "For three sets, A ∩ B ∩ C contains elements common to ____.", o: ["A and B only", "A only", "all three sets", "B and C only"], a: 2, exp: "A triple intersection contains exclusively elements that simultaneously belong to A, B, and C." },
    { q: "A real number that is not rational is ____.", o: ["natural", "irrational", "whole", "integer"], a: 1, exp: "Real numbers that cannot be expressed as fractions of integers are termed irrational numbers (e.g., √2, π)." },
    { q: "Which is rational?", o: ["3/5", "π", "√7", "√2"], a: 0, exp: "3/5 is expressed as a ratio of two integers, making it rational." },
    { q: "Which property is a + b = b + a?", o: ["associative", "distributive", "inverse", "commutative"], a: 3, exp: "The commutative property of addition states that the order of addends does not affect the sum." },
    { q: "Which property is a(b + c) = ab + ac?", o: ["distributive", "commutative", "inverse", "identity"], a: 0, exp: "The distributive property distributes multiplication over addition." },
    { q: "8⁰ equals ____.", o: ["1", "undefined", "0", "8"], a: 0, exp: "Any nonzero real number raised to the power of zero equals 1." },
    { q: "3² × 3⁴ equals ____.", o: ["9⁴", "3⁸", "3⁶", "6³"], a: 2, exp: "Applying exponent laws for multiplication: 3²⁺⁴ = 3⁶." },
    { q: "5⁷ ÷ 5³ equals ____.", o: ["5¹⁰", "5²¹", "5⁴", "5³"], a: 2, exp: "Applying exponent laws for division: 5⁷⁻³ = 5⁴." },
    { q: "(2³)⁴ equals ____.", o: ["2⁷", "2⁴", "2¹²", "8⁴"], a: 2, exp: "Power of a power rule: multiply exponents, 3 × 4 = 12, yielding 2¹²." },
    { q: "For a ≠ 0, a⁻ⁿ equals ____.", o: ["1/aⁿ", "n/a", "−aⁿ", "aⁿ"], a: 0, exp: "Negative exponent rule: a⁻ⁿ = 1 / aⁿ." },
    { q: "81¹/⁴ equals ____.", o: ["4", "2", "9", "3"], a: 3, exp: "Fourth root of 81 is 3, because 3⁴ = 81." },
    { q: "If 3ˣ = 27, x = ____.", o: ["4", "3", "2", "9"], a: 1, exp: "Since 27 = 3³, equating exponents gives x = 3." },
    { q: "logₐ1 equals ____.", o: ["1", "−1", "a", "0"], a: 3, exp: "a⁰ = 1, so logₐ 1 = 0 for any valid base a." },
    { q: "logₐ(aᵐ) equals ____.", o: ["aᵐ", "a + m", "am", "m"], a: 3, exp: "Logarithm and exponential functions are inverses, so logₐ(aᵐ) = m." },
    { q: "logₐ(pq) equals ____.", o: ["logₐ(p/q)", "logₐp + logₐq", "logₐp − logₐq", "qlogₐp"], a: 1, exp: "Product rule of logarithms: logₐ(pq) = logₐ p + logₐ q." },
    { q: "logₐ(p/q) equals ____.", o: ["logₐp + logₐq", "logₐ(pq)", "plogₐq", "logₐp − logₐq"], a: 3, exp: "Quotient rule of logarithms: logₐ(p/q) = logₐ p − logₐ q." },
    { q: "If a > b and c > 0, then ac ____ bc.", o: ["<", "cannot be compared", ">", "="], a: 2, exp: "Multiplying an inequality by a positive number preserves the inequality sign." },
    { q: "Multiplying an inequality by a negative number ____ the inequality sign.", o: ["reverses", "removes", "preserves", "squares"], a: 0, exp: "Multiplying or dividing both sides of an inequality by a negative number flips the inequality symbol." },
    { q: "|x| represents the ____ of x from zero.", o: ["square", "reciprocal", "slope", "distance"], a: 3, exp: "Absolute value |x| measures the geometric distance of a number from zero on the real number line." },
    { q: "Solve |x| = 5.", o: ["x = 0", "x = ±5", "x = 5 only", "x = −5 only"], a: 1, exp: "|x| = 5 implies x = 5 or x = −5." },
    { q: "If x < 0, |x| = ____.", o: ["−x", "x", "x²", "0"], a: 0, exp: "For a negative number x, its absolute value is its negation (−x) to yield a positive distance." },
    { q: "Solve |x − 2| < 3.", o: ["x > 5", "−1 < x < 5", "−5 < x < 1", "x < −1"], a: 1, exp: "−3 < x − 2 < 3. Adding 2 across gives −1 < x < 5." },
    { q: "The conjugate of 2 + √3 is ____.", o: ["√3 − 2", "−2 + √3", "−2 − √3", "2 − √3"], a: 3, exp: "The conjugate of a binomial surd a + b√c is a − b√c, so 2 + √3 has conjugate 2 − √3." },
    { q: "The square root of 48 simplifies to ____.", o: ["4√3", "3√4", "8√3", "6√2"], a: 0, exp: "√48 = √(16 × 3) = √16 × √3 = 4√3." },
    { q: "For x² − 5x + 6 = 0, the roots are ____.", o: ["2 and 3", "0 and 6", "−2 and −3", "1 and 6"], a: 0, exp: "(x − 2)(x − 3) = 0, so roots are x = 2 and x = 3." },
    { q: "The first step of mathematical induction is to verify the statement for ____.", o: ["the base case", "the determinant", "2k", "k + 1"], a: 0, exp: "Mathematical induction begins by proving the base case (typically n = 1)." },
    { q: "After the base case, assume the statement is true for ____.", o: ["n = k+1", "n = 0", "n = 2k", "n = k"], a: 3, exp: "The inductive hypothesis assumes the proposition holds true for an arbitrary integer n = k." },
    { q: "The induction step proves the statement for ____.", o: ["n = 2k", "n = k+1", "n = k−1", "n = 0"], a: 1, exp: "The induction step demonstrates that truth for k implies truth for n = k + 1." },
    { q: "The formula 1+2+...+n equals ____.", o: ["n(n−1)/2", "n²", "n(n+1)/2", "2n"], a: 2, exp: "The sum of the first n natural numbers is given by n(n+1)/2." },
    { q: "1+2+3+4 equals ____.", o: ["12", "8", "16", "10"], a: 3, exp: "Using n=4: 4(5)/2 = 10." },
    { q: "The sum of the first n odd numbers is ____.", o: ["2n", "n(n+1)/2", "n²", "n"], a: 2, exp: "The sum of the first n odd positive integers always equals n²." },
    { q: "In an induction proof, P(k) is called the ____.", o: ["induction hypothesis", "contradiction", "conclusion", "base case"], a: 0, exp: "Assuming P(k) is true is known as the inductive hypothesis." },
    { q: "If P(1) is true and P(k) implies P(k+1), P(n) is true for ____.", o: ["prime n only", "even n only", "n = 1 only", "all positive integers n"], a: 3, exp: "By the principle of mathematical induction, the statement holds for all positive integers n." },
    { q: "Which is NOT an induction step?", o: ["Find a determinant", "verify P(1)", "assume P(k)", "prove P(k+1)"], a: 0, exp: "Finding a determinant belongs to linear algebra, not mathematical induction." },
    { q: "To extend 1+...+k to 1+...+k+(k+1), the next term added is ____.", o: ["k", "k+1", "1", "k²"], a: 1, exp: "The next term in the sequence of summation is (k+1)." },
    { q: "For n=1, 1³+2³+...+n³ equals ____.", o: ["4", "3", "1", "2"], a: 2, exp: "For n=1, the sum is 1³ = 1." },
    { q: "The three main stages are base case, induction hypothesis, and ____.", o: ["induction step", "matrix inversion", "factorization", "integration"], a: 0, exp: "The induction framework consists of the base case, hypothesis, and inductive step." },
    { q: "Induction is especially suited to statements indexed by ____.", o: ["matrices only", "natural numbers", "complex constants only", "only irrational numbers"], a: 1, exp: "Mathematical induction is designed for propositions indexed over the set of natural numbers N." },
    { q: "If a proof establishes P(k) ⇒ P(k+1), it creates a chain from the ____.", o: ["complement", "last term", "base case", "determinant"], a: 2, exp: "The implication combined with the base case establishes the domino effect for all n." },
    { q: "The identity 1³+2³+...+n³ = n²(n+1)²/4 is an example of a formula that can be proved by ____.", o: ["mathematical induction", "Cramer's rule", "partial fractions", "De Morgan's law"], a: 0, exp: "Summation identities of polynomials are standard proofs for mathematical induction." },
    { q: "A sequence is a list of numbers in a specified ____.", o: ["determinant", "matrix", "order", "set only"], a: 2, exp: "A sequence is an ordered list of numbers governed by a specific rule." },
    { q: "The common difference of 2,5,8,11,... is ____.", o: ["3", "8", "5", "2"], a: 0, exp: "d = 5 − 2 = 3." },
    { q: "The nth term of an AP is ____.", o: ["ar⁽ⁿ⁻¹⁾", "a+(n−1)d", "a/d", "a+nd"], a: 1, exp: "The general nth term of an arithmetic progression is Tₙ = a + (n − 1)d." },
    { q: "The 10th term of 2,5,8,... is ____.", o: ["29", "32", "26", "30"], a: 0, exp: "T₁₀ = 2 + (10 − 1)(3) = 2 + 27 = 29." },
    { q: "The common difference of 8,4,0,−4,... is ____.", o: ["−8", "8", "−4", "4"], a: 2, exp: "d = 4 − 8 = −4." },
    { q: "The sum of n AP terms is ____.", o: ["a+(n−1)d", "ar⁽ⁿ⁻¹⁾", "n/2[2a+(n−1)d]", "a/(1−r)"], a: 2, exp: "Sₙ = (n/2)[2a + (n − 1)d]." },
    { q: "If a=1,d=7,n=11, Sₙ = ____.", o: ["407", "385", "420", "396"], a: 3, exp: "S₁₁ = (11/2)[2(1) + 10(7)] = (11/2)(72) = 396." },

    { q: "On the unit circle, coordinates are ____.", o: ["(sinθ, cosθ)", "(tanθ, secθ)", "(rθ, r/θ)", "(cosθ, sinθ)"], a: 3, exp: "Points on the unit circle correspond to (cosθ, sinθ)." },
    { q: "sinθ equals ____.", o: ["hypotenuse/opposite", "opposite/hypotenuse", "adjacent/hypotenuse", "opposite/adjacent"], a: 1, exp: "SohCahToa: sine = opposite / hypotenuse." },
    { q: "cosθ equals ____.", o: ["opposite/adjacent", "opposite/hypotenuse", "adjacent/hypotenuse", "hypotenuse/adjacent"], a: 2, exp: "SohCahToa: cosine = adjacent / hypotenuse." },
    { q: "tanθ equals ____.", o: ["1/cosθ", "1/sinθ", "cosθ/sinθ", "sinθ/cosθ"], a: 3, exp: "Tangent = opposite / adjacent = sinθ / cosθ." },
    { q: "sin30° equals ____.", o: ["1", "√2/2", "√3/2", "1/2"], a: 3, exp: "sin(30°) = 1/2." },
    { q: "cos60° equals ____.", o: ["1/2", "0", "√3/2", "1"], a: 0, exp: "cos(60°) = 1/2." },
    { q: "tan45° equals ____.", o: ["0", "1", "√3", "1/2"], a: 1, exp: "tan(45°) = 1." },
    { q: "The identity sin²θ+cos²θ equals ____.", o: ["1", "0", "sinθcosθ", "2"], a: 0, exp: "Pythagorean trig identity: sin²θ + cos²θ = 1." },
    { q: "The identity 1+tan²θ is equal to ____.", o: ["sec²θ", "1", "cot²θ", "csc²θ"], a: 0, exp: "1 + tan²θ = sec²θ." },
    { q: "The identity 1+cot²θ is equal to ____.", o: ["csc²θ", "tan²θ", "1", "sec²θ"], a: 0, exp: "1 + cot²θ = csc²θ." }
];

let activeExam = [];
let timeLeft = 1200; // 20 minutes countdown (20 * 60)
let timer;
const totalExamQuestions = 40; 
let currentQuestionIndex = 0;

function shufflePool(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function initExam() {
    setTimeout(() => { document.getElementById('sync-loader').style.display = 'none'; }, 1000);

    let shuffledSelection = shufflePool([...fullMthPool]);
    activeExam = shuffledSelection.slice(0, totalExamQuestions);
    timeLeft = 1200; 
    currentQuestionIndex = 0; 
    
    renderQuestions();
    buildStatusPanel();
    showQuestion(currentQuestionIndex); 
    startTimer();
}

function renderQuestions() {
    const list = document.getElementById('question-list');
    list.innerHTML = activeExam.map((item, idx) => `
        <div class="question-block" id="block-q${idx}">
            <p><strong>${idx + 1}. ${item.q}</strong></p>
            <div class="options-group">
                ${item.o.map((opt, i) => `
                    <label><input type="radio" name="q${idx}" value="${i}" onchange="updateTrackStatus(${idx})"> ${String.fromCharCode(65 + i)}. ${opt}</label>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function buildStatusPanel() {
    const panelGrid = document.getElementById('status-panel-grid');
    let dotsHTML = '';
    for(let i = 0; i < totalExamQuestions; i++) {
        dotsHTML += `<div class="tracker-dot" id="dot-q${i}" onclick="jumpToQuestion(${i})">${i + 1}</div>`;
    }
    panelGrid.innerHTML = dotsHTML;
}

function showQuestion(index) {
    const blocks = document.querySelectorAll('.question-block');
    blocks.forEach((block, idx) => { block.classList.toggle('active', idx === index); });

    const dots = document.querySelectorAll('.tracker-dot');
    dots.forEach((dot, idx) => { dot.classList.toggle('current', idx === index); });

    document.getElementById('prev-btn').disabled = (index === 0);
    document.getElementById('next-btn').disabled = (index === totalExamQuestions - 1);
}

function navigateQuestion(step) {
    currentQuestionIndex += step;
    showQuestion(currentQuestionIndex);
}

function jumpToQuestion(idx) {
    currentQuestionIndex = idx;
    showQuestion(currentQuestionIndex);
}

function updateTrackStatus(idx) {
    const targetDot = document.getElementById(`dot-q${idx}`);
    if (targetDot) targetDot.classList.add('answered');
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft/60), s = timeLeft%60;
        document.getElementById('timer').innerText = `Time Remaining: ${m}:${s<10?'0':''}${s}`;
        if(timeLeft <= 0) submitExam();
    }, 1000);
}

function submitExam() {
    clearInterval(timer);
    let score = 0;
    let reviewHTML = `<h2 style="font-size: 1.5rem; margin-bottom: 20px; color: var(--navy); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Detailed Review & Step-by-Step Solutions</h2>`;

    activeExam.forEach((item, idx) => {
        const sel = document.querySelector(`input[name="q${idx}"]:checked`);
        const userVal = sel ? parseInt(sel.value) : null;
        const correct = userVal === item.a;
        if(correct) score++;

        const userAnsText = userVal !== null ? `${String.fromCharCode(65 + userVal)}. ${item.o[userVal]}` : 'Skipped / Unanswered';
        const correctAnsText = `${String.fromCharCode(65 + item.a)}. ${item.o[item.a]}`;

        reviewHTML += `
            <div class="review-card" style="border-left: 5px solid ${correct ? '#38761d' : '#d32f2f'};">
                <p style="font-weight: 700; font-size: 1.05rem; margin-bottom: 8px;">${idx + 1}. ${item.q}</p>
                <p style="color: ${correct ? '#38761d' : '#d32f2f'}; font-weight: 600; margin-bottom: 4px;">
                    Your Answer: ${userAnsText} ${correct ? '✓' : '✗'}
                </p>
                ${!correct ? `<p style="color: #38761d; font-weight: 700; margin-bottom: 8px;">Correct Answer: ${correctAnsText}</p>` : ''}
                
                <div class="explanation-box ${correct ? 'correct-bg' : 'wrong-bg'}">
                    <strong>📐 Step-by-Step Solution:</strong> ${item.exp}
                </div>
            </div>`;
    });

    let percentage = Math.round((score / totalExamQuestions) * 100);
    let grade = "";
    let remark = "";
    let statusEmoji = "";

    if (percentage >= 70) {
        grade = "A"; remark = "Excellent! You have mastered MTH 101 algebra & set theory concepts!"; statusEmoji = "🔥🏆";
    } else if (percentage >= 60) {
        grade = "B"; remark = "Very Good! You're a math wizard in the making 😅."; statusEmoji = "😎✨";
    } else if (percentage >= 50) {
        grade = "C"; remark = "Good effort. Double check your quadratic and sequence formulas."; statusEmoji = "👍📖";
    } else if (percentage >= 45) {
        grade = "D"; remark = "Pass. Practice your logarithm rules and set laws."; statusEmoji = "⚠️📝";
    } else if (percentage >= 40) {
        grade = "E"; remark = "Fair. But you still gats read bro, algebra step-by-step."; statusEmoji = "👀⏳";
    } else {
        grade = "F"; remark = "Omo, go and read your MTH oooo! 😂"; statusEmoji = "💀❌";
    }

    document.getElementById('exam-container').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    
    resultScreen.innerHTML = `
        <div style="font-size: 4rem; margin-bottom: 10px;">${statusEmoji}</div>
        <h1 style="font-size: 3.5rem; margin: 0; color: var(--navy);">Grade: ${grade}</h1>
        <h2 style="font-weight: 600; margin: 10px 0; color: var(--green);">${percentage}% (${score} / ${totalExamQuestions} Correct)</h2>
        <p style="font-size: 1.15rem; max-width: 600px; margin: 0 auto 30px auto; color: #475569; font-weight: 600;">"${remark}"</p>
        <div id="review-area">${reviewHTML}</div>
        <button class="btn-action" onclick="location.reload()">Try Again</button>
    `;
    
    window.scrollTo(0,0);
}
</script>
</body>
</html>
