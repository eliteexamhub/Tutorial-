const fullEntPool = [
    { q: "The concept ‘entrepreneur’ was first coined by:", o: ["David McClelland", "Richard Cantillon", "David Hisrich", "Jean-Baptiste Say"], a: 1, exp: "Richard Cantillon, an 18th-century Irish-French economist, introduced the term 'entrepreneur' in his economic writings to describe an individual who bears financial uncertainty and risk." },
    { q: "The non-continuous process of combining resources of time, man, money and materials to create products, services and ideas is:", o: ["Entrepreneurship", "Management", "Intrapreneurship", "Production"], a: 0, exp: "Entrepreneurship is dynamic and non-continuous (occurring when opportunities arise), whereas routine administrative management is continuous." },
    { q: "An individual who exhibits innovative abilities, perceives market opportunities, and has the motivation, drive and ability to mobilize resources to meet market opportunities while working in an existing organization is referred to as an:", o: ["Entrepreneur", "Inventor", "Intrapreneur", "Manager"], a: 2, exp: "An intrapreneur exercises entrepreneurial initiative, innovation, and risk-taking from within an established corporate organization." },
    { q: "The characteristics of entrepreneurs as risk-bearers, coordinators and organizers, gap-fillers, leaders, and innovators or creative imitators were listed by:", o: ["Adam Smith", "David Ricardo", "John Stuart Mill", "Joseph Schumpeter"], a: 3, exp: "Joseph Schumpeter emphasized the role of the entrepreneur as an innovator driving economic development through creative destruction and structural organization." },
    { q: "The two disciplines where entrepreneurship originated were:", o: ["French / English", "Economics / Business", "Economics / History", "History / French"], a: 1, exp: "Entrepreneurship theory emerged from historical economic literature examining wealth creation and business enterprise development." },
    { q: "The one who creates a new enterprise in a risky and uncertain environment is referred to as an:", o: ["Risk taker", "Entrepreneur", "Adventurist", "Leader"], a: 1, exp: "An entrepreneur assumes personal and financial risk to launch and manage a new business venture in an uncertain market environment." },
    { q: "Which one of the following is NOT considered entrepreneurship?", o: ["The creation of a new business", "The routine management of an ongoing operation", "Innovation applied to a business context", "The combination of resources"], a: 1, exp: "Routine management maintains existing operational processes without introducing new venture creation or innovative risk-taking." },
    { q: "The scholar who first stressed the significance of entrepreneurship for economic growth is:", o: ["Cantillon", "Mill", "Quesnay", "Ricardo"], a: 0, exp: "Richard Cantillon was the earliest economic theorist to systematically link entrepreneurial decision-making to broader market mechanics and economic growth." },
    { q: "When an entrepreneur directs and controls all organizational activities to ensure that things are done properly and on schedule, he is performing the role of:", o: ["Leader", "Resource allocator", "Directing and controlling", "Visionary"], a: 0, exp: "As an organizational leader, the entrepreneur guides team members, enforces discipline, and aligns operations to meet strategic targets." },
    { q: "An entrepreneur who starts a business with a fresh idea is simply performing the role of a:", o: ["Leader", "Resource allocator", "Director and controller", "Visionary"], a: 3, exp: "A visionary conceptualizes novel opportunities and forward-thinking ideas that serve as the foundation for new enterprises." },
    { q: "Which one of the following is an important source of idea generation due to familiarity with the needs of the market?", o: ["Commitment to opportunity", "Existing products and services", "Distribution channels", "Federal government"], a: 1, exp: "Analyzing existing products and services exposes market gaps, customer complaints, and areas where improvements or alternatives can be developed." },
    { q: "Creativity is:", o: ["The ability to bring something new into existence", "The process of doing new things", "The ability to imitate perfectly", "All of the above"], a: 0, exp: "Creativity is defined as the cognitive ability to generate original, novel, and imaginative ideas or concepts." },
    { q: "The first step in the creative process according to Holt (1992) is:", o: ["Incubation", "Preparation", "Idea generation", "Verification"], a: 2, exp: "Holt's creative process begins with idea generation, where raw thoughts and potential opportunities are first identified." },
    { q: "The following are forms of innovation EXCEPT:", o: ["Technological innovation", "Product-market innovation", "Administrative innovation", "Idea generation"], a: 3, exp: "Idea generation belongs to the creative phase, whereas technological, product-market, and administrative changes represent applied forms of innovation." },
    { q: "When innovation brings about a new dominant design and a new set of core design concepts embodied in components linked together in a new architecture, it is known as:", o: ["Architectural innovation", "Radical innovation", "Modular innovation", "Incremental innovation"], a: 1, exp: "Radical innovation fundamentally transforms core product architecture and concepts, rendering older technologies obsolete." },
    { q: "The creative process according to Holt (1992) can be classified into:", o: ["4 stages", "5 stages", "6 stages", "7 stages"], a: 1, exp: "Holt outlines 5 distinct stages in the creative process: Idea generation, Preparation, Incubation, Illumination, and Verification." },
    { q: "When innovation consists of market research, product design, and innovations in advertising and promotion, it is said to be:", o: ["Technological innovation", "Product-market innovation", "Consumer-related innovation", "Administrative innovation"], a: 1, exp: "Product-market innovation focuses on adapting physical products, positioning, branding, and promotional strategy to target consumer needs." },
    { q: "According to Adams (2005), the following are critical to individual creativity EXCEPT:", o: ["Knowledge", "Thinking", "Personal motivation", "Verification"], a: 2, exp: "Adams highlights domain knowledge, creative thinking skills, and structural evaluation techniques as key drivers of creative output." },
    { q: "The entrepreneur can assess the internal environment of the business by critically looking at:", o: ["5 Ps", "5 Ss", "5 Ws", "5 Ts"], a: 1, exp: "The 5 Ss framework (Skills, Strategy, Structure, Systems, Shared Values) provides a thorough diagnostic scan of internal organizational resources." },
    { q: "A written document prepared by an entrepreneur which describes all the relevant internal and external issues involved in starting a new business venture is called:", o: ["Business plan", "Feasibility study", "Appraisal", "Business structure"], a: 0, exp: "A business plan is a comprehensive blueprint detailing operational, financial, marketing, and strategic plans for a startup." },
    { q: "SMIEIS stands for:", o: ["Small and Medium Industry Equity Investment Schemes", "Small and Medium e-Investment Schools", "Small and Medium Industry Equity Investment Schools", "None of the above"], a: 0, exp: "SMIEIS is a Nigerian financial policy initiative requiring banks to set aside equity funds to support small and medium-scale enterprises." },
    { q: "The chief motivational factor for entrepreneurs to leave jobs is the frustration of not being allowed to perform at the level of which they are capable. This applies to:", o: ["Male", "Female", "Young", "All of the above"], a: 3, exp: "Job dissatisfaction and blocked career potential act as universal push factors motivating diverse demographic groups to seek independence." },
    { q: "The difference between management and entrepreneurship is that while management is continuous, ______ is non-continuous.", o: ["Entrepreneurships", "Entrepreneur", "Environmental", "Management"], a: 0, exp: "Management involves ongoing daily administrative oversight, whereas entrepreneurship occurs episodically during periods of creation and innovation." },
    { q: "Innovation is invention and:", o: ["Creativity", "Design", "Exploitation", "Growth"], a: 0, exp: "Innovation converts creative ideas and technical inventions into practical, commercially viable market solutions." },
    { q: "______ is the person who creates a business enterprise, establishes it, and nurses it to survival and success.", o: ["Entrepreneur", "Sales manager", "Feasibility report", "Feasibility study"], a: 0, exp: "The entrepreneur takes responsibility for initiating the enterprise and guiding it through initial market hurdles to stability." },
    { q: "When the multiplicity of environments becomes too complex to handle, international entrepreneurs often:", o: ["Go for merger", "Diversify", "Decentralize operations", "Sell out the foreign business"], a: 0, exp: "Forming strategic mergers with local firms helps mitigate complex regulatory, cultural, and political risks in foreign markets." },
    { q: "The entrepreneur utilizes resources through:", o: ["Identifying and evaluating the opportunity", "Developing a business plan", "Implementing the business plan", "Managing the enterprise"], a: 0, exp: "Effective resource utilization begins by identifying an unfulfilled market demand and evaluating its commercial viability." },
    { q: "The difference in the entrepreneurial and managerial domains has contributed towards an increased interest in:", o: ["Forming new firms", "Partnership", "Intrapreneurship", "Private firms"], a: 0, exp: "Recognizing that entrepreneurial agility drives competitive advantage has fueled new firm creation and venture formation." },
    { q: "There are ______ routes or paths to entrepreneurial opportunities.", o: ["4", "5", "7", "3"], a: 0, exp: "Literature identifies 4 primary pathways to business opportunities: starting a new venture, buying an existing business, franchising, and family business succession." },
    { q: "Which of the following allows for criticism in the process of generating a business idea?", o: ["Matrix charting", "Brainstorming", "Reverse brainstorming", "Collective notebook"], a: 2, exp: "Unlike standard brainstorming where judgment is deferred, reverse brainstorming actively seeks out flaws, risks, and critical weaknesses." },
    { q: "COSIRA means in Britain:", o: ["Council for Small Industries in Rural Areas", "Committee for Small Industries in Rural Areas", "Council for Small Investment in Rural Areas", "Committee for Small Investment in Rural Areas"], a: 0, exp: "COSIRA was a historic British government body established to provide financial advisory support to rural enterprises." },
    { q: "______ is an exclusionary right that conveys the right to prevent others from copying, selling, performing, displaying or making derivative versions of a work of authorship.", o: ["Patent right", "Intellectual right", "Copyright", "Royalty"], a: 2, exp: "Copyright legally protects original artistic, literary, and musical works from unauthorized reproduction or distribution." },
    { q: "COSIRA is to Britain while ______ is to Nigeria.", o: ["SMEs", "SMIESIS", "SMEDIS", "SMEDAN"], a: 1, exp: "SMIEIS serves as a primary institutional framework for small-scale enterprise funding support in Nigeria, mirroring historical development schemes." },
    { q: "Which of the following four Ps of marketing according to McCarthy (1975) is the odd one out?", o: ["Product", "Place", "Promotion", "Public relations"], a: 3, exp: "McCarthy's traditional 4 Ps are Product, Price, Place, and Promotion. Public relations is a tactical subset of promotion." },
    { q: "Which one of the following is the fourth step in the entrepreneurial process?", o: ["Developing successful business ideas", "Deciding to become an entrepreneur", "Growing the entrepreneurial firm", "Moving from an idea to an entrepreneurial firm"], a: 2, exp: "The 4th phase of the entrepreneurial lifecycle focuses on managing, scaling, and growing the established enterprise." },
    { q: "An individual who initiates, creates and manages a new business can be called:", o: ["A leader", "A manager", "A professional", "An entrepreneur"], a: 3, exp: "Initiating, building, and assuming risk for a new commercial enterprise defines an entrepreneur." },
    { q: "A person owning and running a small firm is known as:", o: ["A manager-owner", "An owner-manager", "A professional adapter", "An enterprise worker"], a: 1, exp: "An owner-manager directly retains equity ownership while personally handling daily operational management." },
    { q: "Someone who improves an existing business can be called:", o: ["An intrapreneur", "A professional", "A co-worker", "A changeling"], a: 0, exp: "Intrapreneurs drive internal innovation, process improvements, and corporate restructuring within existing businesses." },
    { q: "Where individual skills are collectively integrated into a group, this is known as:", o: ["Collective entrepreneurship", "Intrapreneurship", "Team entrepreneurship", "Dual innovation"], a: 2, exp: "Team entrepreneurship pools complementary skills, resources, and leadership across a founding team." },
    { q: "The scanning of the business environment to identify the favourable and unfavourable conditions therein is called:", o: ["SWOT analysis", "External evaluation", "Internal evaluation", "Market analysis"], a: 0, exp: "SWOT analysis evaluates internal Strengths/Weaknesses along with external Opportunities/Threats." },
    { q: "Threats from external environmental factors can come from:", o: ["Direct competition", "Indirect competitors", "Consumers", "All of the above"], a: 3, exp: "External threats arise from direct market rivals, substitute products, changing consumer preferences, and economic shifts." },
    { q: "The essence of scanning the external environment of a business is to identify:", o: ["Only strengths", "Weaknesses", "Strengths and weaknesses", "Opportunities and threats"], a: 3, exp: "External environmental analysis specifically pinpoints market Opportunities to capture and Threats to mitigate." },
    { q: "The entrepreneur can assess the internal environment of a business by critically looking at:", o: ["Opportunities", "Threats and opportunities", "Strengths and threats", "Strengths and weaknesses"], a: 3, exp: "Internal diagnostic scans focus strictly on organizational Strengths and internal operational Weaknesses." },
    { q: "Which of the following is NOT an advantage of sole proprietorship?", o: ["Ownership of all profits", "Minimum legal restriction", "Unlimited liability", "Privacy"], a: 2, exp: "Unlimited liability is a significant risk and disadvantage, exposing personal assets to business debts." },
    { q: "The minimum number of people required to start a sole proprietorship is:", o: ["One", "Two", "Seven", "Twenty"], a: 0, exp: "A sole proprietorship is owned and operated by a single individual." },
    { q: "All of the following are disadvantages of sole proprietorship EXCEPT:", o: ["Limited growth", "Unlimited liability", "Lack of continuity after the death of the promoter", "Easy to raise capital"], a: 3, exp: "Sole proprietorships struggle to raise capital; easy capital acquisition is NOT a feature of this business structure." },
    { q: "Partnership formation requires a minimum and maximum number of partners, respectively, of:", o: ["2 and 20", "2 and 50", "2 and 7", "7 and 20"], a: 0, exp: "General partnership laws typically specify a minimum of 2 partners and a general maximum cap of 20 members." },
    { q: "The document that states all the terms of a partnership is known as:", o: ["Partnership agreement", "Article of partnership", "Article of association", "Article of partnership and article of association"], a: 3, exp: "The formal legal contract governing partner duties, profit shares, and operational terms is known as the Partnership Deed / Agreement." },
    { q: "General partners have:", o: ["Limited liability", "Unlimited liability", "Participation in the day-to-day running of the business", "Unlimited liability and participation in the day-to-day running of the business"], a: 3, exp: "General partners bear full personal liability for business obligations and maintain active management oversight." },
    { q: "The management of resources in a small firm is largely concerned with:", o: ["Operations", "Finance", "Marketing", "All of the above"], a: 3, exp: "Small business survival relies on coordinating operational workflows, financial capital, and marketing activities." },
    { q: "Acquiring the use of equipment such as machinery without owning it is known as:", o: ["Leasing", "Hire purchase", "Factoring", "Acquisition"], a: 0, exp: "Leasing allows a business to operate assets for a specified period in exchange for rental payments without transferring ownership." },
    { q: "Which type of business should prepare a business plan for a new venture?", o: ["Sole traders only", "Limited companies only", "All businesses", "Only those asked to by the bank"], a: 2, exp: "Every enterprise benefits from structured planning to guide strategy, resource allocation, and risk management." },
    { q: "A cash flow forecast will form part of which section of a business plan?", o: ["Operations", "Marketing", "Finance", "Executive summary"], a: 2, exp: "Cash flow projections, break-even analyses, and income statements belong in the financial section." },
    { q: "A key aspect of the financial section of a business plan is:", o: ["A statement of management skills", "A realistic sales forecast", "Production capacity", "A description of competitors"], a: 1, exp: "Realistic revenue and sales projections underpin all financial planning and working capital requirements." },
    { q: "As a new company grows, the entrepreneur will need to:", o: ["Be responsive to changes in the market", "Ensure financial controls are maintained", "Build a management team", "All of the above"], a: 3, exp: "Scaling a business requires strategic flexibility, strict financial management, and delegating responsibilities to a capable leadership team." },
    { q: "The business planning process sometimes fails because:", o: ["The planning process is poorly managed", "Plans are impractical", "Planners lack the appropriate skills", "All of the above"], a: 3, exp: "Flawed market assumptions, lack of financial expertise, and unexecuted strategies frequently lead to plan failure." },
    { q: "Being overoptimistic about market size when starting a new business venture could be a result of:", o: ["Proper planning", "Poor market research", "Diversifying too soon", "Focusing on sales volume rather than profit"], a: 1, exp: "Inadequate or biased market research leads founders to overestimate demand and customer acquisition rates." },
    { q: "Which technique is an excellent method for initially screening ideas and concepts in addition to generating new ideas?", o: ["Focus group", "Brainstorming", "Problem inventory analysis", "Reverse brainstorming"], a: 1, exp: "Brainstorming encourages rapid, uninhibited idea generation across diverse perspectives for initial screening." },
    { q: "The importance of intellectual property should be understood by an entrepreneur even before:", o: ["Hiring a manager", "Engaging an attorney", "Developing a product", "Establishing a new venture"], a: 2, exp: "Filing for patents or protecting trade secrets prior to product development prevents theft or public disclosure issues." },
    { q: "An idea for a new product is tested on potential consumers to determine consumer acceptance at the ______ stage.", o: ["Concept", "Product development", "Test marketing", "Commercialization"], a: 2, exp: "Test marketing places prototypes into sample consumer segments to measure real-world feedback and purchase intent." },
    { q: "Entrepreneurship can best be described as:", o: ["A process that requires setting up a business", "Taking a significant risk in a business context", "Having a strong vision", "A process involving innovation, new products or services, and value creation"], a: 3, exp: "Entrepreneurship integrates innovation, market opportunity recognition, value creation, and calculated risk-taking." },
    { q: "Which statement best describes the context for entrepreneurship?", o: ["Entrepreneurship takes place in small businesses", "Entrepreneurship takes place in large businesses", "Entrepreneurship takes place in a wide variety of contexts", "Entrepreneurship does not take place in social enterprises"], a: 2, exp: "Entrepreneurial activity occurs across startups, corporate enterprises, non-profits, public entities, and social ventures." },
    { q: "Entrepreneurs are motivated by:", o: ["Money", "Personal values", "Pull influences", "All of the above"], a: 3, exp: "Founders are driven by a combination of financial gain, personal fulfillment, market opportunities (pull), and career dissatisfaction (push)." },
    { q: "The sociological theory of entrepreneurship refers to:", o: ["Looking at individuals' personality traits", "Understanding how thought processes influence entrepreneurial capacity", "Describing how different business types influence entrepreneurial activity", "Reviewing how the environment influences who becomes entrepreneurial"], a: 3, exp: "Sociological perspectives analyze how cultural values, social networks, family background, and environmental norms shape entrepreneurship." },
    { q: "Which one of the following is NOT considered one of the building blocks of the model entrepreneur?", o: ["Technical skills", "Management competencies", "Business awareness", "Personal attributes"], a: 2, exp: "Core framework models highlight personal traits, technical expertise, and management capabilities as baseline pillars." },
    { q: "Which of the following is LEAST likely to influence the timing of new business births?", o: ["Government policies", "Profitability", "Consumer expenditure", "Weather conditions"], a: 3, exp: "Routine weather patterns generally exert minimal direct influence on overall macroeconomic business creation timing." },

let activeExam = [];
let timeLeft = 1200; // 20 minutes countdown (20 * 60)
let timer;
const totalExamQuestions = 60; 
let currentQuestionIndex = 0;

function shufflePool(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function initExam() {
    setTimeout(() => { document.getElementById('sync-loader').style.display = 'none'; }, 1000);

    let shuffledSelection = shufflePool([...fullEntPool]);
    activeExam = shuffledSelection.slice(0, totalExamQuestions);
    timeLeft = 1200; 
    currentQuestionIndex = 0; 
    
    renderQuestions();
    buildStatusPanel();
    showQuestion(currentQuestionIndex); 
    startTimer();
}

function renderQuestions() {
    const list = document.getElementById('question-list');
    list.innerHTML = activeExam.map((item, idx) => `
        <div class="question-block" id="block-q${idx}">
            <p><strong>${idx + 1}. ${item.q}</strong></p>
            <div class="options-group">
                ${item.o.map((opt, i) => `
                    <label><input type="radio" name="q${idx}" value="${i}" onchange="updateTrackStatus(${idx})"> ${String.fromCharCode(65 + i)}.${opt}</label>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function buildStatusPanel() {
    const panelGrid = document.getElementById('status-panel-grid');
    let dotsHTML = '';
    for(let i = 0; i < totalExamQuestions; i++) {
        dotsHTML += `<div class="tracker-dot" id="dot-q${i}" onclick="jumpToQuestion(${i})">${i + 1}</div>`;
    }
    panelGrid.innerHTML = dotsHTML;
}

function showQuestion(index) {
    const blocks = document.querySelectorAll('.question-block');
    blocks.forEach((block, idx) => { block.classList.toggle('active', idx === index); });

    const dots = document.querySelectorAll('.tracker-dot');
    dots.forEach((dot, idx) => { dot.classList.toggle('current', idx === index); });

    document.getElementById('prev-btn').disabled = (index === 0);
    document.getElementById('next-btn').disabled = (index === totalExamQuestions - 1);
}

function navigateQuestion(step) {
    currentQuestionIndex += step;
    showQuestion(currentQuestionIndex);
}

function jumpToQuestion(idx) {
    currentQuestionIndex = idx;
    showQuestion(currentQuestionIndex);
}

function updateTrackStatus(idx) {
    const targetDot = document.getElementById(`dot-q${idx}`);
    if (targetDot) targetDot.classList.add('answered');
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft/60), s = timeLeft%60;
        document.getElementById('timer').innerText = `Time Remaining: ${m}:${s<10?'0':''}${s}`;
        if(timeLeft <= 0) submitExam();
    }, 1000);
}

function submitExam() {
    clearInterval(timer);
    let score = 0;
    let reviewHTML = `<h2 style="font-size: 1.5rem; margin-bottom: 20px; color: var(--navy); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Detailed Review & Explanations</h2>`;

    activeExam.forEach((item, idx) => {
        const sel = document.querySelector(`input[name="q${idx}"]:checked`);
        const userVal = sel ? parseInt(sel.value) : null;
        const correct = userVal === item.a;
        if(correct) score++;

        const userAnsText = userVal !== null ? `${String.fromCharCode(65 + userVal)}. ${item.o[userVal]}` : 'Skipped / Unanswered';
        const correctAnsText = `${String.fromCharCode(65 + item.a)}. ${item.o[item.a]}`;

        reviewHTML += `
            <div class="review-card" style="border-left: 5px solid ${correct ? '#38761d' : '#d32f2f'};">
                <p style="font-weight: 700; font-size: 1.05rem; margin-bottom: 8px;">${idx + 1}. ${item.q}</p>
                <p style="color: ${correct ? '#38761d' : '#d32f2f'}; font-weight: 600; margin-bottom: 4px;">
                    Your Answer: ${userAnsText} ${correct ? '✓' : '✗'}
                </p>
                ${!correct ? `<p style="color: #38761d; font-weight: 700; margin-bottom: 8px;">Correct Answer: ${correctAnsText}</p>` : ''}
                
                <div class="explanation-box ${correct ? 'correct-bg' : 'wrong-bg'}">
                    <strong>🧠 Tutor Explanation:</strong> ${item.exp}
                </div>
            </div>`;
    });

    let percentage = Math.round((score / totalExamQuestions) * 100);
    let grade = "";
    let remark = "";
    let statusEmoji = "";

    if (percentage >= 70) {
        grade = "A"; remark = "Excellent! You have mastered ENT 101 entrepreneurship fundamentals!"; statusEmoji = "🔥🏆";
    } else if (percentage >= 60) {
        grade = "B"; remark = "Very Good! You're an expert entrepreneur in the making 😅."; statusEmoji = "😎✨";
    } else if (percentage >= 50) {
        grade = "C"; remark = "Good effort. Double check your business planning and environment basics."; statusEmoji = "👍📖";
    } else if (percentage >= 45) {
        grade = "D"; remark = "Pass. Practice your innovation and feasibility study rules."; statusEmoji = "⚠️📝";
    } else if (percentage >= 40) {
        grade = "E"; remark = "Fair. But you still gats read bro, take it step-by-step."; statusEmoji = "👀⏳";
    } else {
        grade = "F"; remark = "Omo, go and read your ENT 101 oooo! 😂"; statusEmoji = "💀❌";
    }

    document.getElementById('exam-container').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    
    resultScreen.innerHTML = `
        <div style="font-size: 4rem; margin-bottom: 10px;">${statusEmoji}</div>
        <h1 style="font-size: 3.5rem; margin: 0; color: var(--navy);">Grade: ${grade}</h1>
        <h2 style="font-weight: 600; margin: 10px 0; color: var(--green);">${percentage}% (${score} / ${totalExamQuestions} Correct)</h2>
        <p style="font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px auto; color: #475569; font-weight: 400;">"${remark}"</p>
        <div id="review-area">${reviewHTML}</div>
        <button class="btn-action" onclick="location.reload()">Try Again</button>
    `;
    
    window.scrollTo(0,0);
}
</script>
</body>
</html>
