<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Elite Exam Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');

        :root {
            --navy: #001f3f;
            --navy-mid: #003366;
            --green: #38761d;
            --green-bright: #4bb543;
            --green-glow: rgba(56, 118, 29, 0.35);
            --bg-light: #f8fafc;
            --gradient-brand: linear-gradient(135deg, #001f3f 0%, #003366 50%, #38761d 100%);
            --gradient-btn: linear-gradient(135deg, #001f3f 0%, #38761d 100%);
            --gradient-btn-hover: linear-gradient(135deg, #002b57 0%, #4bb543 100%);
            --gradient-accent: linear-gradient(135deg, #38761d 0%, #4bb543 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* BACKGROUND AMBIENT GLOWS */
        .bg-glow-1 {
            position: absolute;
            top: -10%;
            right: -5%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            filter: blur(80px);
            animation: floatGlow 12s ease-in-out infinite alternate;
            z-index: 0;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 31, 63, 0.2) 0%, transparent 70%);
            filter: blur(90px);
            animation: floatGlow 15s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        /* MAIN CARD CONTAINER */
        .card-container {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 36px;
            padding: 60px 45px;
            max-width: 820px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 31, 63, 0.12), 0 0 0 1px rgba(0, 31, 63, 0.04);
            border-top: 8px solid var(--green);
            overflow: hidden;
            animation: elasticCard 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* FLOATING PILL BADGE */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(56, 118, 29, 0.08);
            border: 1px solid rgba(56, 118, 29, 0.2);
            color: var(--green);
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            animation: fadeIn 0.8s ease forwards 0.2s;
            opacity: 0;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--green);
            animation: pulseGlow 2s infinite;
        }

        /* TITLE SPLIT ANIMATION */
        .title-wrapper {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px 0;
        }

        .text-top {
            font-size: clamp(2.2rem, 4.5vw, 3.8rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            color: var(--navy);
            display: block;
            opacity: 0;
            transform: translateY(-80px);
            animation: meetFromTop 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s forwards;
        }

        .text-bottom {
            font-size: clamp(2.4rem, 5vw, 4.2rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            display: block;
            opacity: 0;
            transform: translateY(80px);
            animation: meetFromBottom 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s forwards;
        }

        .highlight-navy {
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .highlight-green {
            color: var(--green);
        }

        /* SUBTITLE */
        .hero-subtitle {
            font-size: clamp(0.98rem, 1.8vw, 1.2rem);
            color: #475569;
            font-weight: 400;
            max-width: 620px;
            margin: 0 auto 35px auto;
            line-height: 1.6;
            animation: fadeIn 0.8s ease forwards 0.8s;
            opacity: 0;
        }

        /* GET STARTED BUTTON */
        .btn-wrapper {
            animation: fadeIn 0.8s ease forwards 0.95s;
            opacity: 0;
            margin-bottom: 25px;
        }

        .btn-get-started {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--gradient-btn);
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
            padding: 18px 42px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 31, 63, 0.25);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.5px;
        }

        .btn-get-started:hover {
            background: var(--gradient-btn-hover);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(56, 118, 29, 0.35);
        }

        .btn-get-started:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* ACCENT UNDERLINE */
        .accent-bar {
            width: 100px;
            height: 5px;
            background: var(--gradient-accent);
            margin: 0 auto;
            border-radius: 10px;
            animation: expandBar 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
            opacity: 0;
        }

        /* KEYFRAME ANIMATIONS */
        @keyframes elasticCard {
            0% { opacity: 0; transform: scale(0.85) translateY(40px); }
            70% { transform: scale(1.02) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes meetFromTop {
            0% { opacity: 0; transform: translateY(-80px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes meetFromBottom {
            0% { opacity: 0; transform: translateY(80px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes expandBar {
            0% { width: 0px; opacity: 0; }
            100% { width: 100px; opacity: 1; }
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.6; }
        }

        @media (max-width: 600px) {
            .card-container { padding: 40px 22px; }
            .text-top { font-size: 2rem; }
            .text-bottom { font-size: 2.2rem; }
            .btn-get-started { padding: 15px 32px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="card-container">
        <div class="badge">
            <span class="badge-dot"></span>
            Official CBT Engine
        </div>

        <div class="title-wrapper">
            <span class="text-top">WELCOME TO</span>
            <span class="text-bottom">
                <span class="highlight-navy">ELITE</span> <span class="highlight-green">EXAM HUB</span>
            </span>
        </div>

        <p class="hero-subtitle">
            Next-Generation Computer-Based Testing & High-Performance Examination Portal
        </p>

        <div class="btn-wrapper">
            <a href="homepage.html" class="btn-get-started">
                Get Started ➔
            </a>
        </div>

        <div class="accent-bar"></div>
    </div>

</body>
</html>
