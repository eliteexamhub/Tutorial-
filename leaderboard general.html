<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Exam Hub - General Leaderboard Coming Soon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');

        :root {
            --navy: #001f3f;
            --navy-dark: #001226;
            --green: #38761d;
            --green-bright: #4bb543;
            --gold: #f59e0b;
            --bg-light: #f8fafc;
            --card-shadow: 0 15px 35px -5px rgba(0, 31, 63, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER / NAVBAR */
        header {
            background: #ffffff;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 31, 63, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--navy);
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--green);
        }

        .back-btn {
            background: #f1f5f9;
            color: var(--navy);
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--navy);
            color: #ffffff;
        }

        /* MAIN CONTAINER */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .coming-soon-card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 28px;
            padding: 50px 40px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 31, 63, 0.06);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .coming-soon-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--green) 100%);
        }

        .trophy-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 10px;
        }

        .badge-coming-soon {
            display: inline-block;
            background: #fef3c7;
            color: #d97706;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .card-description {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: var(--navy);
            color: #ffffff;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(0, 31, 63, 0.15);
        }

        .btn-home:hover {
            background: var(--green);
            transform: translateY(-2px);
        }

        /* FOOTER */
        footer {
            background: #ffffff;
            padding: 20px 40px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }

        .footer-copy {
            font-size: 0.85rem;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .coming-soon-card {
                padding: 35px 20px;
            }
            header {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <a href="index.html" class="brand-logo">
            ELITE <span>EXAM HUB</span>
        </a>
        <a href="index.html" class="back-btn">← Back to Portal</a>
    </header>

    <!-- MAIN BODY -->
    <div class="main-container">
        <div class="coming-soon-card">
            <div class="trophy-icon">🏆</div>
            <h1 class="card-title">General Leaderboard</h1>
            <div>
                <span class="badge-coming-soon">Coming Soon</span>
            </div>
            <p class="card-description">We are building an epic live ranking system to showcase top scorers across all general test sessions. Stay tuned!</p>
            
            <a href="index.html" class="btn-home">Return to Home Portal</a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-copy">&copy; 2026 Elite Exam Hub. All rights reserved.</div>
    </footer>

</body>
</html>
