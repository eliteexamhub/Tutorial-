        .sidebar-wrapper { position: -webkit-sticky; position: sticky; top: 20px; z-index: 999; }

        .timer-bar { position: -webkit-sticky; position: sticky; top: 20px; background: var(--green); color: white; padding: 14px; border-radius: 50px; text-align: center; font-weight: bold; z-index: 100; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(56,118,29,0.3); font-size: 1.1rem; }
        
        .question-block { display: none; margin-bottom: 35px; padding-bottom: 25px; text-align: left; }
        .question-block.active { display: block; }
        
        .question-block p { font-size: 1.05rem; line-height: 1.6; margin-top: 0; }
        .options-group label { display: flex; align-items: center; background: #f8fafc; padding: 16px; margin: 12px 0; border-radius: 14px; cursor: pointer; border: 1px solid #e2e8f0; transition: all 0.2s ease; font-weight: 400; }

        .nav-controls { display: flex; gap: 15px; margin-top: 25px; margin-bottom: 15px; }

        .btn-nav:hover { background: #334155; }
        .btn-nav:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        
        .btn-action { width: 100%; padding: 18px; background: var(--navy); color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 1.05rem; cursor: pointer; margin-top: 20px; transition: background 0.2s, transform 0.1s; }
        .btn-action:hover { background: #002d5c; }
        .btn-action:active { transform: scale(0.99); }
        
        .tracker-sidebar { background: white; padding: 24px; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid rgba(0,31,63,0.1); max-height: calc(100vh - 80px); display: flex; flex-direction: column; }
        .tracker-title { font-weight: 800; font-size: 1rem; margin-bottom: 15px; text-align: center; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; letter-spacing: 0.5px; }
        .tracker-container { overflow-y: auto; padding-right: 4px; }
        .tracker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .tracker-dot { height: 40px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: #64748b; cursor: pointer; transition: all 0.2s ease; }
        .tracker-dot:hover { border-color: var(--navy); color: var(--navy); background: #e2e8f0; }
        .tracker-dot.current { border-color: var(--navy); color: var(--navy); background: #e2e8f0; box-shadow: 0 0 0 2px var(--navy); }
        .tracker-dot.answered { background: var(--green); color: white; border-color: var(--green); box-shadow: 0 4px 10px rgba(56,118,29,0.2); }
        .tracker-dot.answered.current { box-shadow: 0 0 0 2px var(--navy); }

        .review-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: left; box-shadow: var(--card-shadow); border: 1px solid #e2e8f0; }
        .explanation-box { margin-top: 12px; padding: 14px; border-radius: 10px; font-size: 0.92rem; line-height: 1.5; }
        .explanation-box.correct-bg { background: var(--green-light); border-left: 4px solid var(--green); color: #1e4620; }
        .explanation-box.wrong-bg { background: var(--red-light); border-left: 4px solid #d32f2f; color: #991b1b; }

        #result-screen { display: none; text-align: center; padding: 50px 20px; }
        
        footer { margin-top: auto; padding: 40px 20px 20px 20px; text-align: center; border-top: 1px solid #e2e8f0; width: 100%; box-sizing: border-box; }
        .footer-copy { font-size: 0.9rem; color: #64748b; margin-bottom: 15px; }
        .dev-btn { background: transparent; border: 1px solid var(--navy); color: var(--navy); padding: 8px 20px; border-radius: 50px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; font-family: 'Poppins', sans-serif; text-decoration: none; display: inline-block; }
        .dev-btn:hover { background: var(--navy); color: white; }
    </style>
</head>

    // WEEK ONE
    { q: "A computer can best be defined as a machine that is used to ______.", o: ["Produce electricity", "Process data to give required information", "Manufacture furniture", "Store only pictures"], a: 1, exp: "A computer is an electronic device that accepts raw data as input, processes it according to stored instructions, and produces meaningful information as output." },

    { q: "Blaise Pascal is associated with the invention of the ______.", o: ["Analytical Engine", "Pascaline", "Difference Engine", "Tabulating Machine"], a: 1, exp: "Blaise Pascal invented the Pascaline in 1642, one of the earliest mechanical adding machines." },

    { q: "Charles Babbage designed the ______.", o: ["Analytical Engine", "Pascaline", "ENIAC", "Abacus"], a: 0, exp: "Babbage's Analytical Engine introduced core architectural concepts like memory, arithmetic logic units, and programmed control." },

    { q: "Herman Hollerith is associated with the development of the ______.", o: ["Tabulating machine", "Analytical Engine", "Pascaline", "Abacus"], a: 0, exp: "Herman Hollerith developed electromechanical tabulating machines utilizing punched cards to process the 1890 U.S. Census." },
    { q: "Which of the following was an important feature of Hollerith's machine?", o: ["Touchscreen", "Punched cards", "Wireless mouse", "Laser printer"], a: 1, exp: "Hollerith's tabulator read data encoded as holes on punched cards, laying the groundwork for automated data processing." },

    { q: "Which of the following is an example of computer input?", o: ["Printed result", "Information displayed on a monitor", "Data entered through a keyboard", "Sound from a speaker"], a: 2, exp: "Keyboards are input devices used by operators to feed instructions and raw data into the system." },
    { q: "The output produced by a computer may be in the form of ______.", o: ["Information", "Raw data only", "Electricity only", "Instructions only"], a: 0, exp: "Computers convert raw inputs into processed, intelligible information delivered via output peripherals." },

    // WEEK TWO
    { q: "Which of the following is a characteristic of a computer?", o: ["Slowness", "Accuracy", "Forgetfulness", "Laziness"], a: 1, exp: "Computers operate with extreme precision and accuracy, executing programmed instructions without computational errors." },

    { q: "The ability of a computer to perform repeated operations without becoming tired is related to ______.", o: ["Diligence", "Colour", "Portability", "Size"], a: 0, exp: "Diligence means computers never experience fatigue, boredom, or loss of concentration during repetitive tasks." },
    { q: "Which characteristic means that a computer can perform different types of tasks?", o: ["Versatility", "Slowness", "Fragility", "Silence"], a: 0, exp: "Versatility describes a computer's adaptability to execute entirely different applications, from word processing to gaming." },
    { q: "The three major components of a computer system are hardware, software and ______.", o: ["Firmware", "Humanware", "Keyboard", "Monitor"], a: 1, exp: "A complete computer system relies on physical hardware, intangible software instructions, and humanware (users/administrators)." },
    { q: "Computer hardware refers to ______.", o: ["Physical components of a computer", "Computer instructions", "Internet websites", "User passwords"], a: 0, exp: "Hardware encompasses all tangible, physical parts of a computer system that you can physically touch and see." },
    { q: "Which of the following is hardware?", o: ["Windows", "Keyboard", "Microsoft Word", "Operating system"], a: 1, exp: "A keyboard is a physical input device, making it hardware." },

    { q: "Which of the following is an output device?", o: ["Keyboard", "Mouse", "Monitor", "Scanner"], a: 2, exp: "A monitor visually displays processed information to the user, functioning as an output device." },

    { q: "Which of the following is a storage device?", o: ["Hard drive", "Mouse", "Keyboard", "Monitor"], a: 0, exp: "Hard drives provide long-term non-volatile magnetic or solid-state data storage." },

    { q: "The term \"humanware\" refers primarily to ______.", o: ["People who use or operate computer systems", "Computer cables", "Computer memory", "Operating systems"], a: 0, exp: "Humanware (or liveware) refers to the human users, programmers, and technicians who interact with computer systems." },

    // WEEK THREE
    { q: "Computers are widely used in education for ______.", o: ["Teaching and learning", "Cooking only", "Building houses manually", "Farming without data"], a: 0, exp: "Educational institutions utilize computers for e-learning, research, virtual classrooms, and administrative management." },
    { q: "Which of the following is an application area of computers mentioned in the material?", o: ["Banking", "Fishing only", "Dancing only", "Sleeping"], a: 0, exp: "Banking utilizes secure computer networks for customer accounts, ATM transactions, and online transfers." },
    { q: "Computers are used in hospitals mainly to support ______.", o: ["Healthcare operations", "Road construction only", "Entertainment only", "Sports training only"], a: 0, exp: "Medical facilities rely on computers for patient record keeping, diagnostic imaging, and life support monitoring." },

    { q: "Computers have become important in business because they can ______.", o: ["Process and manage information", "Eliminate all employees", "Replace electricity", "Work without instructions"], a: 0, exp: "Businesses leverage computers to streamline data processing, inventory tracking, and communications." },
    { q: "Which of the following is an application area of computing?", o: ["Marketing", "Sleeping", "Eating", "Walking"], a: 0, exp: "Digital marketing utilizes computing tools for data analytics, social media campaigns, and targeted advertising." },
    { q: "Computers can support communication through ______.", o: ["Internet services", "Chalk only", "Paper alone", "Manual counting only"], a: 0, exp: "Internet connectivity enables global email, VoIP calls, messaging apps, and video conferencing." },
    { q: "Which sector can use computers for calculations, simulations and data analysis?", o: ["Science", "Sleeping", "Cooking only", "Dancing only"], a: 0, exp: "Scientific research uses high-performance computers for complex modeling, simulations, and data crunching." },
    { q: "The usefulness of computers in society is largely due to their ability to ______.", o: ["Process information efficiently", "Eat food", "Sleep", "Walk"], a: 0, exp: "Efficient information processing is the primary driver of computing utility across modern industries." },

    // WEEK FOUR
    { q: "Data communication refers to the transmission of digital data between ______.", o: ["Two or more computers/devices", "Two books", "Two chairs", "Two buildings without devices"], a: 0, exp: "Data communication involves transferring digital bits across a transmission medium between connected devices." },
    { q: "A network is a group of computers that are ______.", o: ["Connected together", "Always switched off", "Used only for games", "Not able to communicate"], a: 0, exp: "A computer network links multiple autonomous devices together to share data, printers, and internet access." },
    { q: "LAN stands for ______.", o: ["Local Area Network", "Large Access Network", "Long Area Node", "Local Application Number"], a: 0, exp: "LAN connects computers within a limited geographical area such as a single room, office, or school building." },
    { q: "PAN stands for ______.", o: ["Personal Area Network", "Public Access Network", "Personal Application Node", "Private Area Number"], a: 0, exp: "PAN refers to a very small network centered around an individual person (e.g., Bluetooth pairing a phone to a smartwatch)." },
    { q: "WAN stands for ______.", o: ["Wide Area Network", "Wireless Access Number", "World Application Network", "Wide Application Node"], a: 0, exp: "WAN spans large geographical regions connecting countries or continents (with the Internet being the prime example)." },
    { q: "MAN stands for ______.", o: ["Metropolitan Area Network", "Main Access Network", "Machine Area Node", "Multiple Application Network"], a: 0, exp: "MAN covers an entire city or town, bridging multiple LANs together across a metropolitan zone." },
    { q: "Which type of network is generally associated with a person's devices?", o: ["PAN", "WAN", "MAN", "CAN"], a: 0, exp: "Personal Area Networks (PAN) operate within a range of roughly 10 meters around a single individual." },

let activeExam = [];
let timeLeft = 1800; // 30 minutes countdown (30 * 60)
let timer;
const totalExamQuestions = 40;  
let currentQuestionIndex = 0;

function shufflePool(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function initExam() {
    setTimeout(() => { document.getElementById('sync-loader').style.display = 'none'; }, 1000);

    let shuffledSelection = shufflePool([...fullCscPool]);
    activeExam = shuffledSelection.slice(0, totalExamQuestions);
    timeLeft = 1800; 
    currentQuestionIndex = 0; 
    
    renderQuestions();
    buildStatusPanel();
    showQuestion(currentQuestionIndex); 
    startTimer();
}

function renderQuestions() {
    const list = document.getElementById('question-list');
    list.innerHTML = activeExam.map((item, idx) => `
        <div class="question-block" id="block-q${idx}">
            <p><strong>${idx + 1}. ${item.q}</strong></p>
            <div class="options-group">
                ${item.o.map((opt, i) => `
                    <label><input type="radio" name="q${idx}" value="${i}" onchange="updateTrackStatus(${idx})"> ${String.fromCharCode(65 + i)}.${opt}</label>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function buildStatusPanel() {
    const panelGrid = document.getElementById('status-panel-grid');
    let dotsHTML = '';
    for(let i = 0; i < totalExamQuestions; i++) {
        dotsHTML += `<div class="tracker-dot" id="dot-q${i}" onclick="jumpToQuestion(${i})">${i + 1}</div>`;
    }
    panelGrid.innerHTML = dotsHTML;
}

function showQuestion(index) {
    const blocks = document.querySelectorAll('.question-block');
    blocks.forEach((block, idx) => { block.classList.toggle('active', idx === index); });

    const dots = document.querySelectorAll('.tracker-dot');
    dots.forEach((dot, idx) => { dot.classList.toggle('current', idx === index); });

    document.getElementById('prev-btn').disabled = (index === 0);
    document.getElementById('next-btn').disabled = (index === totalExamQuestions - 1);
}

function navigateQuestion(step) {
    currentQuestionIndex += step;
    showQuestion(currentQuestionIndex);
}

function jumpToQuestion(idx) {
    currentQuestionIndex = idx;
    showQuestion(currentQuestionIndex);
}

function updateTrackStatus(idx) {
    const targetDot = document.getElementById(`dot-q${idx}`);
    if (targetDot) targetDot.classList.add('answered');
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft/60), s = timeLeft%60;
        document.getElementById('timer').innerText = `Time Remaining: ${m}:${s<10?'0':''}${s}`;
        if(timeLeft <= 0) submitExam();
    }, 1000);
}

function submitExam() {
    clearInterval(timer);
    let score = 0;
    let reviewHTML = `<h2 style="font-size: 1.5rem; margin-bottom: 20px; color: var(--navy); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Detailed Review & Explanations</h2>`;

    activeExam.forEach((item, idx) => {
        const sel = document.querySelector(`input[name="q${idx}"]:checked`);
        const userVal = sel ? parseInt(sel.value) : null;
        const correct = userVal === item.a;
        if(correct) score++;

        const userAnsText = userVal !== null ? `${String.fromCharCode(65 + userVal)}. ${item.o[userVal]}` : 'Skipped / Unanswered';
        const correctAnsText = `${String.fromCharCode(65 + item.a)}. ${item.o[item.a]}`;

        reviewHTML += `
            <div class="review-card" style="border-left: 5px solid ${correct ? '#38761d' : '#d32f2f'};">
                <p style="font-weight: 700; font-size: 1.05rem; margin-bottom: 8px;">${idx + 1}. ${item.q}</p>
                <p style="color: ${correct ? '#38761d' : '#d32f2f'}; font-weight: 600; margin-bottom: 4px;">
                    Your Answer: ${userAnsText} ${correct ? '✓' : '✗'}
                </p>
                ${!correct ? `<p style="color: #38761d; font-weight: 700; margin-bottom: 8px;">Correct Answer: ${correctAnsText}</p>` : ''}
                
                <div class="explanation-box ${correct ? 'correct-bg' : 'wrong-bg'}">
                    <strong>🧠 Tutor Explanation:</strong> ${item.exp}
                </div>
            </div>`;
    });

    let percentage = Math.round((score / totalExamQuestions) * 100);
    let grade = "";
    let remark = "";
    let statusEmoji = "";

    if (percentage >= 70) {
        grade = "A"; remark = "Excellent! You have mastered CSC 101 concepts completely!"; statusEmoji = "🔥🏆";
    } else if (percentage >= 60) {
        grade = "B"; remark = "Very Good! You're a computing genius in the making 😅."; statusEmoji = "😎✨";
    } else if (percentage >= 50) {
        grade = "C"; remark = "Good effort. Double check your OS, network, and hardware topics."; statusEmoji = "👍📖";
    } else if (percentage >= 45) {
        grade = "D"; remark = "Pass. Review your topologies, shortcuts, and early computing history."; statusEmoji = "⚠️📝";
    } else if (percentage >= 40) {
        grade = "E"; remark = "Fair. But you still gats read bro, CSC step-by-step."; statusEmoji = "👀⏳";
    } else {
        grade = "F"; remark = "Omo, go and read your CSC 101 oooo! 😂"; statusEmoji = "💀❌";
    }

    document.getElementById('exam-container').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    
    resultScreen.innerHTML = `
        <div style="font-size: 4rem; margin-bottom: 10px;">${statusEmoji}</div>
        <h1 style="font-size: 3.5rem; margin: 0; color: var(--navy);">Grade: ${grade}</h1>
        <h2 style="font-weight: 600; margin: 10px 0; color: var(--green);">${percentage}% (${score} / ${totalExamQuestions} Correct)</h2>
        <p style="font-size: 1.15rem; max-width: 600px; margin: 0 auto 30px auto; color: #475569; font-weight: 600;">"${remark}"</p>
        <div id="review-area">${reviewHTML}</div>
        <button class="btn-action" onclick="location.reload()">Try Again</button>
    `;
    
    window.scrollTo(0,0);
}
</script>
</body>
</html>
