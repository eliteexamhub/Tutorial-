<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Exam Hub - CHM 101 Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        :root { 
            --navy: #001f3f; 
            --green: #38761d; 
            --green-light: #eef7ed;
            --red-light: #fef2f2;
            --light-bg: #f8fafc; 
            --gradient: linear-gradient(135deg, #001f3f 0%, #38761d 100%); 
            --card-shadow: 0 10px 25px -5px rgba(0, 31, 63, 0.05), 0 8px 10px -6px rgba(0, 31, 63, 0.05);
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--light-bg); margin: 0; padding: 20px; color: var(--navy); display: flex; flex-direction: column; min-height: 100vh; }
        
        #sync-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--green); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 900px; margin: auto; flex: 1; width: 100%; box-sizing: border-box; }
        header { text-align: center; padding: 40px 20px; background: var(--gradient); color: white; border-radius: 24px; margin-bottom: 35px; box-shadow: 0 10px 30px rgba(0,31,63,0.15); }
        header h1 { margin: 0; font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; }
        header p { margin: 10px 0 0 0; opacity: 0.9; font-weight: 300; }
        
        .exam-layout { display: grid; grid-template-columns: 1fr 280px; gap: 25px; max-width: 1150px; margin: auto; align-items: start; width: 100%; box-sizing: border-box; }
        .sidebar-wrapper { position: -webkit-sticky; position: sticky; top: 20px; z-index: 999; }

        @media (max-width: 900px) { 
            .exam-layout { grid-template-columns: 1fr; } 
            .sidebar-wrapper { position: -webkit-sticky; position: sticky; top: 10px; width: 100%; } 
        }

        #exam-main { background: white; padding: 30px; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid rgba(0,31,63,0.05); }
        .timer-bar { position: -webkit-sticky; position: sticky; top: 20px; background: var(--green); color: white; padding: 14px; border-radius: 50px; text-align: center; font-weight: bold; z-index: 100; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(56,118,29,0.3); font-size: 1.1rem; }
        
        .question-block { display: none; margin-bottom: 35px; padding-bottom: 25px; text-align: left; }
        .question-block.active { display: block; }
        
        .question-block p { font-size: 1.05rem; line-height: 1.6; margin-top: 0; }
        .options-group label { display: flex; align-items: center; background: #f8fafc; padding: 16px; margin: 12px 0; border-radius: 14px; cursor: pointer; border: 1px solid #e2e8f0; transition: all 0.2s ease; font-weight: 400; }
        .options-group label:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .options-group input[type="radio"] { margin-right: 12px; width: 18px; height: 18px; accent-color: var(--green); }
        
        .nav-controls { display: flex; gap: 15px; margin-top: 25px; margin-bottom: 15px; }
        .btn-nav { flex: 1; padding: 15px; background: #475569; color: white; border: none; border-radius: 14px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .btn-nav:hover { background: #334155; }
        .btn-nav:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        
        .btn-action { width: 100%; padding: 18px; background: var(--navy); color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 1.05rem; cursor: pointer; margin-top: 20px; transition: background 0.2s, transform 0.1s; }
        .btn-action:hover { background: #002d5c; }
        .btn-action:active { transform: scale(0.99); }
        
        .tracker-sidebar { background: white; padding: 24px; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid rgba(0,31,63,0.1); max-height: calc(100vh - 80px); display: flex; flex-direction: column; }
        .tracker-title { font-weight: 800; font-size: 1rem; margin-bottom: 15px; text-align: center; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; letter-spacing: 0.5px; }
        .tracker-container { overflow-y: auto; padding-right: 4px; }
        .tracker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .tracker-dot { height: 40px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: #64748b; cursor: pointer; transition: all 0.2s ease; }
        .tracker-dot:hover { border-color: var(--navy); color: var(--navy); background: #e2e8f0; }
        .tracker-dot.current { border-color: var(--navy); color: var(--navy); background: #e2e8f0; box-shadow: 0 0 0 2px var(--navy); }
        .tracker-dot.answered { background: var(--green); color: white; border-color: var(--green); box-shadow: 0 4px 10px rgba(56,118,29,0.2); }
        .tracker-dot.answered.current { box-shadow: 0 0 0 2px var(--navy); }

        /* REVIEW STYLES */
        .review-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: left; box-shadow: var(--card-shadow); border: 1px solid #e2e8f0; }
        .explanation-box { margin-top: 12px; padding: 14px; border-radius: 10px; font-size: 0.92rem; line-height: 1.5; }
        .explanation-box.correct-bg { background: var(--green-light); border-left: 4px solid var(--green); color: #1e4620; }
        .explanation-box.wrong-bg { background: var(--red-light); border-left: 4px solid #d32f2f; color: #991b1b; }

        #result-screen { display: none; text-align: center; padding: 50px 20px; }
        
        footer { margin-top: auto; padding: 40px 20px 20px 20px; text-align: center; border-top: 1px solid #e2e8f0; width: 100%; box-sizing: border-box; }
        .footer-copy { font-size: 0.9rem; color: #64748b; margin-bottom: 15px; }
        .dev-btn { background: transparent; border: 1px solid var(--navy); color: var(--navy); padding: 8px 20px; border-radius: 50px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; font-family: 'Poppins', sans-serif; text-decoration: none; display: inline-block; }
        .dev-btn:hover { background: var(--navy); color: white; }
    </style>
</head>

<script>
const fullChmPool = [

    { q: "Velocity is a derived quantity because it is obtained from ____.", o: ["mass and temperature", "displacement and time", "current and charge", "mass and length only"], a: 1, exp: "Velocity is calculated as displacement divided by time (v = d/t), making it a derived quantity." },
    { q: "A derived unit is obtained from ____.", o: ["base units through algebraic relationships", "only mass", "only length", "arbitrary standards"], a: 0, exp: "Derived units (like m/s or N) are formed by multiplying or dividing base units according to physical formulas." },
    { q: "The value of a physical quantity expresses its dimension in terms of ____.", o: ["a certain accepted unit", "an instrument only", "an error only", "a graph"], a: 0, exp: "Dimensions express physical values in terms of fundamental base unit combinations." },
    { q: "Which statement about significant figures is correct?", o: ["They are the same as decimal places", "They indicate meaningful measured digits", "They remove uncertainty", "They are always four digits"], a: 1, exp: "Significant figures represent all reliable measured digits plus one estimated uncertain digit." },

    { q: "How many significant figures are in 5.00?", o: ["1", "2", "3", "4"], a: 2, exp: "Trailing zeros after a decimal point are significant, giving 5.00 three significant figures." },
    { q: "How many significant figures are in 0.0005?", o: ["1", "2", "3", "4"], a: 0, exp: "Zeros used solely to place the decimal point are not significant; only '5' counts (1 significant figure)." },

    { q: "The number 6000 is considered poorly defined for significant figures because ____.", o: ["it is negative", "the significance of the zeros is unclear", "it has no unit", "it is too large"], a: 1, exp: "Without a decimal point or scientific notation (6.000 x 10³), trailing zeros in large integers are ambiguous." },
    { q: "Precision refers mainly to ____.", o: ["closeness to the true value", "reproducibility among repeated measurements", "size of an instrument", "absence of units"], a: 1, exp: "Precision measures how closely repeated measurement results agree with one another under the same conditions." },
    { q: "Accuracy refers mainly to ____.", o: ["closeness to the true or accepted value", "number of decimal places", "repeatability only", "instrument size"], a: 0, exp: "Accuracy reflects how close a measured value is to the true or standard accepted value." },
    { q: "A set of measurements can be precise but inaccurate when the measurements are ____.", o: ["close together but far from the true value", "random and widely scattered", "exactly true", "unitless"], a: 0, exp: "High reproducibility (precise) combined with systematic bias produces data that is tightly clustered away from the true target (inaccurate)." },
    { q: "Absolute error has ____.", o: ["no units", "the same units as the measured quantity", "only percentage units", "units of time"], a: 1, exp: "Absolute error (|measured - true|) retains the exact physical units of the original measurement." },

    { q: "Relative error is commonly reported as a percentage after multiplying the fractional error by ____.", o: ["10", "50", "100", "1000"], a: 2, exp: "Percentage error = Relative Error x 100%." },

    { q: "Who proposed that matter consists of tiny indivisible atoms in an early Greek philosophical view?", o: ["Dalton", "Democritus", "Thomson", "Bohr"], a: 1, exp: "Democritus first coined the philosophical concept of 'atomos' (indivisible units of matter)." },

    { q: "According to Dalton, atoms of different elements differ in ____.", o: ["mass and other properties", "existence", "units", "volume only"], a: 0, exp: "Dalton noted that elements differ from one another because their constituent atoms possess different masses and chemical behaviors." },

    { q: "J. J. Thomson’s work on cathode rays contributed to the discovery of the ____.", o: ["proton", "electron", "neutron", "isotope"], a: 1, exp: "J.J. Thomson discovered the electron in 1897 by measuring the mass-to-charge ratio of cathode ray particles." },

    { q: "The particle carrying a negative charge is the ____.", o: ["proton", "neutron", "electron", "nucleus"], a: 2, exp: "Electrons are fundamental subatomic particles carrying a unit negative charge (-1)." },
    { q: "The particle carrying a positive charge is the ____.", o: ["electron", "proton", "neutron", "photon"], a: 1, exp: "Protons are nuclear subatomic particles carrying a unit positive charge (+1)." },

    { q: "The atomic number of an element is equal to the number of ____.", o: ["neutrons", "protons", "nucleons only", "shells"], a: 1, exp: "Atomic number (Z) equals the exact count of protons in the atomic nucleus." },

    { q: "An atom with 17 protons has atomic number ____.", o: ["7", "17", "18", "34"], a: 1, exp: "Atomic number (Z) is directly defined by the proton count: 17 protons = Z of 17 (Chlorine)." },

let activeExam = [];
let timeLeft = 1200; // 20 minutes countdown
let timer;
const totalExamQuestions = 40; 
let currentQuestionIndex = 0;

function shufflePool(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function initExam() {
    setTimeout(() => { document.getElementById('sync-loader').style.display = 'none'; }, 1000);

    let shuffledSelection = shufflePool([...fullChmPool]);
    activeExam = shuffledSelection.slice(0, totalExamQuestions);
    timeLeft = 1200; 
    currentQuestionIndex = 0; 
    
    renderQuestions();
    buildStatusPanel();
    showQuestion(currentQuestionIndex); 
    startTimer();
}

function renderQuestions() {
    const list = document.getElementById('question-list');
    list.innerHTML = activeExam.map((item, idx) => `
        <div class="question-block" id="block-q${idx}">
            <p><strong>${idx + 1}. ${item.q}</strong></p>
            <div class="options-group">
                ${item.o.map((opt, i) => `
                    <label><input type="radio" name="q${idx}" value="${i}" onchange="updateTrackStatus(${idx})"> ${String.fromCharCode(65 + i)}.${opt}</label>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function buildStatusPanel() {
    const panelGrid = document.getElementById('status-panel-grid');
    let dotsHTML = '';
    for(let i = 0; i < totalExamQuestions; i++) {
        dotsHTML += `<div class="tracker-dot" id="dot-q${i}" onclick="jumpToQuestion(${i})">${i + 1}</div>`;
    }
    panelGrid.innerHTML = dotsHTML;
}

function showQuestion(index) {
    const blocks = document.querySelectorAll('.question-block');
    blocks.forEach((block, idx) => { block.classList.toggle('active', idx === index); });

    const dots = document.querySelectorAll('.tracker-dot');
    dots.forEach((dot, idx) => { dot.classList.toggle('current', idx === index); });

    document.getElementById('prev-btn').disabled = (index === 0);
    document.getElementById('next-btn').disabled = (index === totalExamQuestions - 1);
}

function navigateQuestion(step) {
    currentQuestionIndex += step;
    showQuestion(currentQuestionIndex);
}

function jumpToQuestion(idx) {
    currentQuestionIndex = idx;
    showQuestion(currentQuestionIndex);
}

function updateTrackStatus(idx) {
    const targetDot = document.getElementById(`dot-q${idx}`);
    if (targetDot) targetDot.classList.add('answered');
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft/60), s = timeLeft%60;
        document.getElementById('timer').innerText = `Time Remaining: ${m}:${s<10?'0':''}${s}`;
        if(timeLeft <= 0) submitExam();
    }, 1000);
}

function submitExam() {
    clearInterval(timer);
    let score = 0;
    let reviewHTML = `<h2 style="font-size: 1.5rem; margin-bottom: 20px; color: var(--navy); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Detailed Review & Explanations</h2>`;

    activeExam.forEach((item, idx) => {
        const sel = document.querySelector(`input[name="q${idx}"]:checked`);
        const userVal = sel ? parseInt(sel.value) : null;
        const correct = userVal === item.a;
        if(correct) score++;

        const userAnsText = userVal !== null ? `${String.fromCharCode(65 + userVal)}. ${item.o[userVal]}` : 'Skipped / Unanswered';
        const correctAnsText = `${String.fromCharCode(65 + item.a)}. ${item.o[item.a]}`;

        reviewHTML += `
            <div class="review-card" style="border-left: 5px solid ${correct ? '#38761d' : '#d32f2f'};">
                <p style="font-weight: 700; font-size: 1.05rem; margin-bottom: 8px;">${idx + 1}. ${item.q}</p>
                <p style="color: ${correct ? '#38761d' : '#d32f2f'}; font-weight: 600; margin-bottom: 4px;">
                    Your Answer: ${userAnsText} ${correct ? '✓' : '✗'}
                </p>
                ${!correct ? `<p style="color: #38761d; font-weight: 700; margin-bottom: 8px;">Correct Answer: ${correctAnsText}</p>` : ''}
                
                <div class="explanation-box ${correct ? 'correct-bg' : 'wrong-bg'}">
                    <strong>🧠 Tutor Explanation:</strong> ${item.exp}
                </div>
            </div>`;
    });

    let percentage = Math.round((score / totalExamQuestions) * 100);
    let grade = "";
    let remark = "";
    let statusEmoji = "";

    if (percentage >= 70) {
        grade = "A"; remark = "Excellent! You have mastered CHM 101 concepts!"; statusEmoji = "🔥🏆";
    } else if (percentage >= 60) {
        grade = "B"; remark = "Very Good! You're a chemistry wizard in the making 😅."; statusEmoji = "😎✨";
    } else if (percentage >= 50) {
        grade = "C"; remark = "Good effort. Double check your stoichiometry and acid-base formulas."; statusEmoji = "👍📖";
    } else if (percentage >= 45) {
        grade = "D"; remark = "Pass. Practice your periodic properties and quantum numbers."; statusEmoji = "⚠️📝";
    } else if (percentage >= 40) {
        grade = "E"; remark = "Fair. But you still gats read bro, atomic structure step-by-step."; statusEmoji = "👀⏳";
    } else {
        grade = "F"; remark = "Omo, go and read your CHM oooo! 😂"; statusEmoji = "💀❌";
    }

    document.getElementById('exam-container').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    
    resultScreen.innerHTML = `
        <div style="font-size: 4rem; margin-bottom: 10px;">${statusEmoji}</div>
        <h1 style="font-size: 3.5rem; margin: 0; color: var(--navy);">Grade: ${grade}</h1>
        <h2 style="font-weight: 600; margin: 10px 0; color: var(--green);">${percentage}% (${score} / ${totalExamQuestions} Correct)</h2>
        <p style="font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px auto; color: #475569; font-weight: 400;">"${remark}"</p>
        <div id="review-area">${reviewHTML}</div>
        <button class="btn-action" onclick="location.reload()">Try Again</button>
    `;
    
    window.scrollTo(0,0);
}
</script>
