<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Exam Hub - Quiz Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');

        :root {
            --navy: #001f3f;
            --navy-dark: #001226;
            --navy-mid: #002b57;
            --green: #38761d;
            --green-bright: #4bb543;
            --whatsapp-green: #25d366;
            --bg-light: #f8fafc;
            --card-shadow: 0 15px 35px -5px rgba(0, 31, 63, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER / NAVBAR */
        header {
            background: #ffffff;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 31, 63, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--navy);
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--green);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-dev-header {
            background: var(--whatsapp-green);
            color: #ffffff !important;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 8px 18px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-dev-header:hover {
            background: #1eb856;
            transform: translateY(-1px);
        }

        /* MAIN CONTAINER */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .quiz-card {
            background: #ffffff;
            width: 100%;
            max-width: 580px;
            border-radius: 28px;
            padding: 45px 40px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 31, 63, 0.06);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(135deg, #001f3f 0%, #38761d 100%);
        }

        /* FORM ELEMENTS */
        .form-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 10px;
        }

        .form-subtitle {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* 🌟 NEXT-LEVEL ULTRA GLOWING ANIMATED START QUIZ BUTTON */
        .btn-glow {
            width: 100%;
            padding: 16px;
            background: linear-gradient(270deg, #001f3f, #38761d, #4bb543, #002b57);
            background-size: 400% 400%;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 25px rgba(56, 118, 29, 0.45), inset 0 0 15px rgba(255, 255, 255, 0.2);
            animation: gradient-shift 6s ease infinite, pulse-glow 3s ease-in-out infinite;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
        }

        .btn-glow:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 40px rgba(75, 181, 67, 0.8), 0 10px 25px rgba(0, 31, 63, 0.3);
            letter-spacing: 1px;
        }

        .btn-glow:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* SECONDARY BUTTON FOR ELITES QUIZ */
        .btn-secondary-glow {
            width: 100%;
            padding: 16px;
            background: linear-gradient(270deg, #002b57, #001f3f, #1e40af, #002b57);
            background-size: 400% 400%;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 25px rgba(0, 43, 87, 0.45), inset 0 0 15px rgba(255, 255, 255, 0.2);
            animation: gradient-shift 6s ease infinite;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 12px;
        }

        .btn-secondary-glow:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 40px rgba(0, 43, 87, 0.8), 0 10px 25px rgba(0, 31, 63, 0.3);
            letter-spacing: 1px;
        }

        .btn-secondary-glow:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* LEADERBOARD BUTTONS */
        .btn-leaderboard {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: var(--navy);
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 12px;
        }

        .btn-leaderboard:hover {
            border-color: var(--navy);
            background: #f1f5f9;
            transform: translateY(-2px);
        }

        /* Smooth background sliding animation */
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Sophisticated breathing neon aura animation */
        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 20px rgba(56, 118, 29, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.1);
            }
            50% {
                box-shadow: 0 0 38px rgba(75, 181, 67, 0.85), 0 0 15px rgba(0, 31, 63, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.3);
            }
            100% {
                box-shadow: 0 0 20px rgba(56, 118, 29, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.1);
            }
        }

        /* FOOTER */
        footer {
            background: #ffffff;
            padding: 20px 40px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }

        .footer-copy {
            font-size: 0.85rem;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .quiz-card {
                padding: 30px 20px;
            }
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <a href="index.html" class="brand-logo">
            ELITE <span>EXAM HUB</span>
        </a>
        <div class="nav-actions">
            <a href="https://wa.me/2349032320783?text=Hello%20Developer,%20I%20have%20an%20inquiry%20regarding%20the%20Elite%20Exam%20Hub." 
               target="_blank" 
               class="btn-dev-header">
                💬 Message Developer
            </a>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="main-container">
        <div class="quiz-card">

            <!-- PARTICIPANT SECTION -->
            <div id="participant-section">
                <div class="form-title">Welcome to the Exam</div>
                <div class="form-subtitle">Choose your preferred quiz category or view performance rankings below.</div>

                <button class="btn-glow" onclick="startGeneralQuiz()">📚 Start General Quiz</button>
                <button class="btn-secondary-glow" onclick="startFacultyQuiz()">🎓 Start ELITES Quiz</button>

                <button class="btn-leaderboard" onclick="openGeneralLeaderboard()">🏆 General Quiz Leaderboard</button>
                <button class="btn-leaderboard" onclick="openEliteLeaderboard()">🌟 ELITES Quiz Leaderboard</button>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-copy">&copy; 2026 Elite Exam Hub. All rights reserved.</div>
    </footer>

    <!-- INTERACTIVE SCRIPT -->
    <script>
        // REDIRECT TO GENERAL QUIZ HTML
        function startGeneralQuiz() {
            window.location.href = "quiz general.html";
        }

        // REDIRECT TO ELITES/FACULTY QUIZ HTML
        function startFacultyQuiz() {
            window.location.href = "quiz elites.html";
        }

        // REDIRECT TO LEADERBOARDS
        function openGeneralLeaderboard() {
            window.location.href = "leaderboard general.html";
        }

        function openEliteLeaderboard() {
            window.location.href = "leaderboard elites.html";
        }
    </script>
</body>
</html>
