        .btn-action { width: 100%; padding: 18px; background: var(--navy); color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 1.05rem; cursor: pointer; margin-top: 20px; transition: background 0.2s, transform 0.1s; }
        .btn-action:hover { background: #002d5c; }
        .btn-action:active { transform: scale(0.99); }
        
        .tracker-sidebar { background: white; padding: 24px; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid rgba(0,31,63,0.1); max-height: calc(100vh - 80px); display: flex; flex-direction: column; }
        .tracker-title { font-weight: 800; font-size: 1rem; margin-bottom: 15px; text-align: center; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; letter-spacing: 0.5px; }
        .tracker-container { overflow-y: auto; padding-right: 4px; }
        .tracker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .tracker-dot { height: 40px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: #64748b; cursor: pointer; transition: all 0.2s ease; }
        .tracker-dot:hover { border-color: var(--navy); color: var(--navy); background: #e2e8f0; }
        .tracker-dot.current { border-color: var(--navy); color: var(--navy); background: #e2e8f0; box-shadow: 0 0 0 2px var(--navy); }
        .tracker-dot.answered { background: var(--green); color: white; border-color: var(--green); box-shadow: 0 4px 10px rgba(56,118,29,0.2); }
        .tracker-dot.answered.current { box-shadow: 0 0 0 2px var(--navy); }

        /* REVIEW STYLES */
        .review-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: left; box-shadow: var(--card-shadow); border: 1px solid #e2e8f0; }
        .explanation-box { margin-top: 12px; padding: 14px; border-radius: 10px; font-size: 0.92rem; line-height: 1.5; }
        .explanation-box.correct-bg { background: var(--green-light); border-left: 4px solid var(--green); color: #1e4620; }
        .explanation-box.wrong-bg { background: var(--red-light); border-left: 4px solid #d32f2f; color: #991b1b; }

        #result-screen { display: none; text-align: center; padding: 50px 20px; }
        
        footer { margin-top: auto; padding: 40px 20px 20px 20px; text-align: center; border-top: 1px solid #e2e8f0; width: 100%; box-sizing: border-box; }
        .footer-copy { font-size: 0.9rem; color: #64748b; margin-bottom: 15px; }
        .dev-btn { background: transparent; border: 1px solid var(--navy); color: var(--navy); padding: 8px 20px; border-radius: 50px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; font-family: 'Poppins', sans-serif; text-decoration: none; display: inline-block; }
        .dev-btn:hover { background: var(--navy); color: white; }
    </style>

    { q: "The science that deals with the study of diseases, their causes, symptoms and effects is called ______.", o: ["Anatomy", "Pathology", "Ecology", "Taxonomy"], a: 1, exp: "Pathology focuses specifically on understanding diseases, structural changes, and functional alterations in living tissues." },

    { q: "The branch of biology concerned mainly with plants is ______.", o: ["Zoology", "Botany", "Cytology", "Physiology"], a: 1, exp: "Botany is the specialized scientific field focused on plant life, structures, and functions." },

    { q: "The branch of biology concerned with the study of cells is called ______.", o: ["Cytology", "Ecology", "Taxonomy", "Genetics"], a: 0, exp: "Cytology (or Cell Biology) examines cell structure, function, organellar mechanics, and division." },
    { q: "The study of heredity and variation is known as ______.", o: ["Genetics", "Ecology", "Anatomy", "Histology"], a: 0, exp: "Genetics investigates how genetic traits and variations are passed from parents to offspring." },
    { q: "Ecology is primarily concerned with ______.", o: ["Cell division", "Interactions between organisms and their environment", "Naming organisms", "Human anatomy"], a: 1, exp: "Ecology studies how living organisms interact with each other and their surrounding ecosystems." },
    { q: "Which biological discipline is most directly concerned with the classification and naming of organisms?", o: ["Taxonomy", "Physiology", "Embryology", "Pathology"], a: 0, exp: "Taxonomy defines, names, and classifies groups of biological organisms based on shared characteristics." },
    { q: "A scientist who studies microorganisms is primarily involved in ______.", o: ["Microbiology", "Astronomy", "Geology", "Economics"], a: 0, exp: "Microbiology deals with microscopic organisms such as bacteria, microscopic algae, fungi, and protozoa." },
    { q: "Which of the following is a characteristic of living organisms?", o: ["Respiration", "Rusting", "Melting", "Crystallization"], a: 0, exp: "Respiration is a vital metabolic process common to living organisms, unlike non-living processes like rusting or melting." },
    { q: "The ability of an organism to respond to changes in its environment is called ______.", o: ["Sensitivity", "Nutrition", "Excretion", "Growth"], a: 0, exp: "Sensitivity (irritability) allows living beings to detect and react to internal or environmental stimuli." },
    { q: "The process by which organisms obtain or manufacture food is called ______.", o: ["Excretion", "Nutrition", "Respiration", "Reproduction"], a: 1, exp: "Nutrition is the intake or synthesis of nutrients needed for energy, growth, and tissue repair." },
    { q: "Which process removes metabolic waste products from an organism?", o: ["Growth", "Excretion", "Nutrition", "Reproduction"], a: 1, exp: "Excretion eliminates toxic nitrogenous wastes and metabolic byproducts from the body." },
    { q: "The production of new individuals by living organisms is called ______.", o: ["Adaptation", "Reproduction", "Respiration", "Sensitivity"], a: 1, exp: "Reproduction ensures species survival through asexual or sexual generation of offspring." },
    { q: "An increase in the size and/or mass of an organism is known as ______.", o: ["Growth", "Nutrition", "Adaptation", "Movement"], a: 0, exp: "Growth is an irreversible quantitative increase in cell size or cell number." },
    { q: "The ability of organisms to survive under particular environmental conditions is associated with ______.", o: ["Adaptation", "Excretion", "Digestion", "Respiration"], a: 0, exp: "Adaptation involves physical or behavioral traits that enhance survival within a specific habitat." },
    { q: "Which of the following is included among the characteristics of living organisms listed in the document?", o: ["Competition", "Magnetism", "Combustion", "Corrosion"], a: 0, exp: "Competition for resources is a fundamental ecological behavior exhibited by living populations." },
    { q: "Which of the following is NOT a characteristic of living organisms listed in the document?", o: ["Movement", "Respiration", "Reproduction", "Evaporation"], a: 3, exp: "Evaporation is a purely physical phase change of water, not a metabolic characteristic of living beings." },
    { q: "Biology is described in the document as a broad subject because it encompasses the study of ______.", o: ["Only human beings", "Only plants", "Life processes from molecular levels to communities", "Only microorganisms"], a: 2, exp: "Biology spans molecular biology up to biome ecology." },
    { q: "Biodiversity refers to ______.", o: ["The study of rocks", "The great variety of living organisms and their habitats", "The study of cells", "The study of weather"], a: 1, exp: "Biodiversity measures biological variation across ecosystems, species, and genetic levels." },
    { q: "Systematics is the scientific study of ______.", o: ["Biological diversity and its evolution", "Weather patterns", "Human diseases only", "Soil chemistry"], a: 0, exp: "Systematics investigates species relationships and evolutionary histories." },
    { q: "Taxonomy is a subdivision of ______.", o: ["Ecology", "Systematics", "Physiology", "Anatomy"], a: 1, exp: "Taxonomy operates inside systematics to categorize evolutionary relationships." },
    { q: "Who is regarded as the Father of Modern Taxonomy?", o: ["Charles Darwin", "Aristotle", "Carolus Linnaeus", "Gregor Mendel"], a: 2, exp: "Carolus Linnaeus established binomial nomenclature and hierarchical classification." },
    { q: "Classification is best described as the ______.", o: ["Random arrangement of organisms", "Orderly arrangement of organisms into groups based on similarities", "Destruction of organisms", "Naming of planets"], a: 1, exp: "Classification arranges organisms into structured taxa based on shared traits." },
    { q: "Which of the following represents the correct taxonomic hierarchy from highest to lowest?", o: ["Species → Genus → Family → Order → Class → Phylum → Kingdom", "Kingdom → Phylum → Class → Order → Family → Genus → Species", "Kingdom → Species → Genus → Family → Class → Order → Phylum", "Phylum → Kingdom → Class → Species → Family → Genus → Order"], a: 1, exp: "Standard hierarchy: Kingdom, Phylum, Class, Order, Family, Genus, Species." },
    { q: "The basic unit of biological classification is the ______.", o: ["Genus", "Family", "Species", "Kingdom"], a: 2, exp: "Species is the primary operational rank in biological classification." },

    { q: "Which scientist laid the foundations for modern biological nomenclature?", o: ["Carolus Linnaeus", "Lamarck", "Watson", "Haeckel"], a: 0, exp: "Linnaeus formalized the two-word naming system for all living things." },
    { q: "Linnaeus initially distinguished which two kingdoms?", o: ["Monera and Protista", "Animalia and Vegetabilia", "Fungi and Plantae", "Protista and Fungi"], a: 1, exp: "Linnaeus divided nature into Animalia (Animals) and Vegetabilia (Plants)." },
    { q: "The scientific naming system in which an organism is given two names is called ______.", o: ["Trinomial nomenclature", "Binomial nomenclature", "Numerical nomenclature", "Molecular nomenclature"], a: 1, exp: "Binomial nomenclature assigns a Genus name and Species descriptor." },
    { q: "The first word in a scientific name represents the ______.", o: ["Species", "Genus", "Family", "Order"], a: 1, exp: "The first word denotes the Genus and is always capitalized." },
    { q: "The second word in a binomial scientific name represents the ______.", o: ["Species-specific name", "Kingdom", "Family", "Phylum"], a: 0, exp: "The second word is the specific epithet (species identifier) written in lowercase." },
    { q: "In scientific nomenclature, the genus name begins with a ______ letter.", o: ["Lowercase", "Capital", "Numerical", "Greek"], a: 1, exp: "Genus names strictly begin with a capital letter (e.g., Homo)." },
    { q: "Which scientific name is correctly written?", o: ["homo Sapiens", "Homo Sapiens", "Homo sapiens", "homo sapiens"], a: 2, exp: "'Homo sapiens' correctly capitalizes Genus and lowercases species." },
    { q: "Why is binomial nomenclature useful?", o: ["It gives organisms standard names worldwide", "It prevents reproduction", "It changes habitats", "It eliminates biodiversity"], a: 0, exp: "It establishes universal scientific naming across different languages." },
    { q: "The three-domain system includes Bacteria, Archaea and ______.", o: ["Plantae", "Eukarya", "Animalia", "Protista"], a: 1, exp: "Carl Woese's domain system consists of Bacteria, Archaea, and Eukarya." },
    { q: "Organisms in the domain Bacteria are generally ______.", o: ["Prokaryotic", "Multicellular animals", "Fungi", "Plants"], a: 0, exp: "Bacteria are unicellular prokaryotes lacking membrane-bound organelles." },
    { q: "Organisms belonging to Eukarya possess ______.", o: ["No DNA", "A true nucleus", "No cell membrane", "No ribosomes"], a: 1, exp: "Eukaryotes are characterized by a true membrane-enclosed nucleus." },
    { q: "The kingdom Monera consists mainly of ______ organisms.", o: ["Prokaryotic", "Multicellular eukaryotic", "Viral", "Fungal"], a: 0, exp: "Kingdom Monera comprises prokaryotic organisms (bacteria & cyanobacteria)." },
    { q: "Which of the following is an example of a prokaryote?", o: ["Bacterium", "Mushroom", "Amoeba", "Fern"], a: 0, exp: "Bacteria lack a true nucleus, making them prokaryotic." },
    { q: "The hereditary material of bacteria is located in the ______.", o: ["True nucleus", "Nucleoid", "Golgi body", "Chloroplast"], a: 1, exp: "Bacterial circular DNA concentrates in an irregular region called the nucleoid." },
    { q: "Which structure is absent in typical prokaryotic cells?", o: ["Ribosome", "Plasma membrane", "Membrane-bound nucleus", "Cytoplasm"], a: 2, exp: "Prokaryotes lack membrane-enclosed nuclei and internal membrane organelles." },
    { q: "The bacterial cell wall commonly contains ______.", o: ["Cellulose only", "Peptidoglycan", "Chitin only", "Glycogen"], a: 1, exp: "Bacterial cell walls rely on peptidoglycan (murein) meshwork." },
    { q: "Gram-positive bacteria have a cell wall that is relatively rich in ______.", o: ["Protein-sugar complexes", "Cellulose", "Chitin", "Lipid only"], a: 0, exp: "Gram-positive cell walls possess a thick peptidoglycan polymer layer." },
    { q: "Gram-negative bacteria possess an additional ______ layer.", o: ["Lipid", "Cellulose", "Chitin", "Nuclear"], a: 0, exp: "Gram-negative bacteria feature an outer lipopolysaccharide membrane." },
    { q: "Which of the following is NOT one of the three major bacterial groups based on habitat mentioned in the document?", o: ["Halophiles", "Thermophiles", "Methanogens", "Protozoans"], a: 3, exp: "Protozoans are eukaryotic protists, not environmental archaebacteria." },
    { q: "Organisms that live in extremely salty environments are called ______.", o: ["Thermophiles", "Halophiles", "Methanogens", "Saprophytes"], a: 1, exp: "Halophiles are adapted to high-salt environments." },

    { q: "Comma-shaped bacteria are called ______.", o: ["Cocci", "Bacilli", "Vibrios", "Spirilla"], a: 2, exp: "Vibrios are comma-curved bacterial rods." },
    { q: "Spiral-shaped bacteria are called ______.", o: ["Spirilla", "Cocci", "Bacilli", "Vibrios"], a: 0, exp: "Spirilla are rigid spiral-shaped bacteria." },

let activeExam = [];
let timeLeft = 1200; // 20 minutes
let timer;
const totalExamQuestions = 60; 
let currentQuestionIndex = 0;

function shufflePool(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function initExam() {
    setTimeout(() => { document.getElementById('sync-loader').style.display = 'none'; }, 1000);

    let shuffledSelection = shufflePool([...fullMthPool]);
    activeExam = shuffledSelection.slice(0, totalExamQuestions);
    timeLeft = 1200; 
    currentQuestionIndex = 0; 
    
    renderQuestions();
    buildStatusPanel();
    showQuestion(currentQuestionIndex); 
    startTimer();
}

function renderQuestions() {
    const list = document.getElementById('question-list');
    list.innerHTML = activeExam.map((item, idx) => `
        <div class="question-block" id="block-q${idx}">
            <p><strong>${idx + 1}. ${item.q}</strong></p>
            <div class="options-group">
                ${item.o.map((opt, i) => `
                    <label><input type="radio" name="q${idx}" value="${i}" onchange="updateTrackStatus(${idx})"> ${String.fromCharCode(65 + i)}.${opt}</label>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function buildStatusPanel() {
    const panelGrid = document.getElementById('status-panel-grid');
    let dotsHTML = '';
    for(let i = 0; i < totalExamQuestions; i++) {
        dotsHTML += `<div class="tracker-dot" id="dot-q${i}" onclick="jumpToQuestion(${i})">${i + 1}</div>`;
    }
    panelGrid.innerHTML = dotsHTML;
}

function showQuestion(index) {
    const blocks = document.querySelectorAll('.question-block');
    blocks.forEach((block, idx) => { block.classList.toggle('active', idx === index); });

    const dots = document.querySelectorAll('.tracker-dot');
    dots.forEach((dot, idx) => { dot.classList.toggle('current', idx === index); });

    document.getElementById('prev-btn').disabled = (index === 0);
    document.getElementById('next-btn').disabled = (index === totalExamQuestions - 1);
}

function navigateQuestion(step) {
    currentQuestionIndex += step;
    showQuestion(currentQuestionIndex);
}

function jumpToQuestion(idx) {
    currentQuestionIndex = idx;
    showQuestion(currentQuestionIndex);
}

function updateTrackStatus(idx) {
    const targetDot = document.getElementById(`dot-q${idx}`);
    if (targetDot) targetDot.classList.add('answered');
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft/60), s = timeLeft%60;
        document.getElementById('timer').innerText = `Time Remaining: ${m}:${s<10?'0':''}${s}`;
        if(timeLeft <= 0) submitExam();
    }, 1000);
}

function submitExam() {
    clearInterval(timer);
    let score = 0;
    let reviewHTML = `<h2 style="font-size: 1.5rem; margin-bottom: 20px; color: var(--navy); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Detailed Review & Explanations</h2>`;

    activeExam.forEach((item, idx) => {
        const sel = document.querySelector(`input[name="q${idx}"]:checked`);
        const userVal = sel ? parseInt(sel.value) : null;
        const correct = userVal === item.a;
        if(correct) score++;

        const userAnsText = userVal !== null ? `${String.fromCharCode(65 + userVal)}. ${item.o[userVal]}` : 'Skipped / Unanswered';
        const correctAnsText = `${String.fromCharCode(65 + item.a)}. ${item.o[item.a]}`;

        reviewHTML += `
            <div class="review-card" style="border-left: 5px solid ${correct ? '#38761d' : '#d32f2f'};">
                <p style="font-weight: 700; font-size: 1.05rem; margin-bottom: 8px;">${idx + 1}. ${item.q}</p>
                <p style="color: ${correct ? '#38761d' : '#d32f2f'}; font-weight: 600; margin-bottom: 4px;">
                    Your Answer: ${userAnsText} ${correct ? '✓' : '✗'}
                </p>
                ${!correct ? `<p style="color: #38761d; font-weight: 700; margin-bottom: 8px;">Correct Answer: ${correctAnsText}</p>` : ''}
                
                <div class="explanation-box ${correct ? 'correct-bg' : 'wrong-bg'}">
                    <strong>🧠 Tutor Explanation:</strong> ${item.exp}
                </div>
            </div>`;
    });

    let percentage = Math.round((score / totalExamQuestions) * 100);
    let grade = "";
    let remark = "";
    let statusEmoji = "";

    if (percentage >= 70) {
        grade = "A"; remark = "Excellent! You have mastered BIO 101 concepts!"; statusEmoji = "🔥🏆";
    } else if (percentage >= 60) {
        grade = "B"; remark = "Very Good! You're a biology wizard in the making 😅."; statusEmoji = "😎✨";
    } else if (percentage >= 50) {
        grade = "C"; remark = "Good effort. Double check your genetics and cell biology terms."; statusEmoji = "👍📖";
    } else if (percentage >= 45) {
        grade = "D"; remark = "Pass. Practice your taxonomic classifications."; statusEmoji = "⚠️📝";
    } else if (percentage >= 40) {
        grade = "E"; remark = "Fair. But you still gats read bro, biology step-by-step."; statusEmoji = "👀⏳";
    } else {
        grade = "F"; remark = "Omo, go and read your BIO oooo! 😂"; statusEmoji = "💀❌";
    }

    document.getElementById('exam-container').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    
    resultScreen.innerHTML = `
        <div style="font-size: 4rem; margin-bottom: 10px;">${statusEmoji}</div>
        <h1 style="font-size: 3.5rem; margin: 0; color: var(--navy);">Grade: ${grade}</h1>
        <h2 style="font-weight: 600; margin: 10px 0; color: var(--green);">${percentage}% (${score} / ${totalExamQuestions} Correct)</h2>
        <p style="font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px auto; color: #475569; font-weight: 400;">"${remark}"</p>
        <div id="review-area">${reviewHTML}</div>
        <button class="btn-action" onclick="location.reload()">Try Again</button>
    `;
    
    window.scrollTo(0,0);
}
</script>
</body>
</html>
